    return adminCard(b,
      kv('Mentor', esc(b.class?.host?.full_name || '-')) +
      kv('Mentor’s bank', esc(accountLine(mentorAcc))) +
      kv('Mentor confirmed', b.class?.mentor_confirmed_at ? 'Yes' : 'Not yet') +
      kv('Student confirmed', b.mentee_confirmed_at ? 'Yes' : b.mentee_issue ? `<span class="danger-text">Problem: ${esc(b.mentee_issue)}</span>` : 'Not yet') +
      kv('Student’s bank', esc(accountLine(studentAcc))),
      `<button class="btn btn-ghost" onclick="askSettle('${b.id}','refund')">Refund student</button><button class="btn btn-brand" onclick="askSettle('${b.id}','release')">Release to mentor</button>`);
  };
  const sec = (t, arr, empty) => `<div class="section-label" style="margin-top:18px"><b>${t}</b> (${arr.length})</div>${arr.length ? arr.map(card).join('') : `<div class="empty-note" style="padding:12px">${empty}</div>`}`;
  el.innerHTML = `
    <div class="stat-row" style="border:none;padding-top:6px">
      <div class="stat"><strong>${rupiah(held)}</strong><span>Held now</span></div>
      <div class="stat"><strong>${upcoming.length}</strong><span>Paid, class ahead</span></div>
    </div>
    ${sec('Problems reported', groups.issue, 'No problems reported.')}
    ${sec('Ready to release', groups.ready, 'Nothing ready yet. Both mentor and student need to confirm.')}
    ${sec('Waiting for confirmation', groups.waiting, 'Nothing waiting.')}`;
}
function askSettle(bid, action){
  const b = bookingById(bid), release = action === 'release';
  const acc = state.accounts[release ? b.class?.host_id : b.user_id];
  const warn = release && payoutState(b) !== 'ready' ? ' Not everyone has confirmed the class yet.' : '';
  openDialog({ title: release ? 'Release to mentor?' : 'Refund the student?',
    body: `Transfer ${rupiah(b.amount)} to ${accountLine(acc)}, then confirm here.${warn}`,
    confirmLabel: release ? 'Mark as paid out' : 'Mark as refunded', cancelLabel:'Not yet', danger: !release },
    () => rpc('admin_settle', { bid, action, note: null }, release ? 'Marked as paid out' : 'Marked as refunded'));
}
function renderAdminHistory(el){
  const list = state.bookings.filter(b => ['released','refunded','rejected','cancelled'].includes(b.status) || bStatus(b) === 'expired');
  el.innerHTML = list.length ? list.map(b => adminCard(b,
    kv('Status', statusPill(bStatus(b))) +
    kv('Mentor', esc(b.class?.host?.full_name || '-')) +
    kv(b.settled_at ? 'Settled' : 'Booked', whenLabel(b.settled_at || b.verified_at || b.created_at)) +
    (b.admin_note ? kv('Note', esc(b.admin_note)) : ''), '')).join('')
    : `<div class="empty-note">Nothing here yet.</div>`;
}

/* ============================================================
   PROFILE + SETTINGS
   ============================================================ */
function renderProfile(b){
  const me = state.me || {}, mentor = state.role === 'mentor';
  b.innerHTML = `
    <div class="profile-top">
      ${avatar(me.id, me.full_name, 'lg')}
      <h3>${esc(me.full_name)}</h3>
      <p>${esc([me.campus, me.major].filter(Boolean).join(', ') || state.session.user.email)}</p>
      <span class="role-pill">${state.role === 'admin' ? 'Admin view' : mentor ? 'Mentor view' : 'Student view'}</span>
    </div>
    <div class="stat-row" style="border:none">
      <div class="stat"><strong>${joinedClasses().length}</strong><span>Joined</span></div>
      <div class="stat"><strong>${hostedClasses().length}</strong><span>Hosting</span></div>
    </div>
    <div class="field-label">${mentor ? 'About you (shown on your classes)' : 'About you'}</div>
    <div class="field-box" style="white-space:pre-wrap">${me.bio ? esc(me.bio) : 'Add a short bio: what you’re good at, courses you aced, competitions you’ve won.'}</div>
    <button class="btn btn-ghost" style="margin-top:14px;width:100%" onclick="openEditProfile()">Edit profile</button>
    ${bankBlockHTML()}
    <p class="role-hint">Switch between Student and Mentor at the top. Same account, two views.</p>`;
}

function openEditProfile(){
  const me = state.me;
  $('formOverlay').innerHTML = `
    <div class="overlay-header"><button class="back-btn" onclick="closeOverlay('formOverlay')" aria-label="Back">${ic.back}</button><div class="overlay-title">Edit profile</div></div>
    <form class="overlay-body" id="profileForm" novalidate><div class="pad">
      <div class="field"><label for="pName">Full name</label><input class="input" id="pName" maxlength="60" value="${esc(me.full_name)}"></div>
      <div class="row-2">
        <div class="field"><label for="pCampus">Campus</label><input class="input" id="pCampus" maxlength="80" value="${esc(me.campus || '')}"></div>
        <div class="field"><label for="pMajor">Major</label><input class="input" id="pMajor" maxlength="80" value="${esc(me.major || '')}"></div>
      </div>
      <div class="field"><label for="pBio">About you</label><textarea class="input" id="pBio" maxlength="400">${esc(me.bio || '')}</textarea><span class="sub">Students see this on the classes you host.</span></div>
      <div class="form-error" id="profileError" role="alert"></div>
      <button class="btn btn-brand" type="submit" style="width:100%">Save profile</button>
    </div></form>`;
  $('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const full_name = $('pName').value.trim();
    if (!full_name) { $('profileError').textContent = 'Your name can’t be empty.'; return; }
    const { data, error } = await sb.from('profiles').update({ full_name,
      campus: $('pCampus').value.trim() || null, major: $('pMajor').value.trim() || null, bio: $('pBio').value.trim() || null,
    }).eq('id', uid()).select('*').single();
    if (error) { $('profileError').textContent = friendlyError(error); return; }
    state.me = data; names.set(data.id, data.full_name);
    closeOverlay('formOverlay');
    await loadClasses().catch(() => {});
    renderHeader(); renderBody(); showToast('Profile saved');
  });
  openOverlay('formOverlay');
}

function openSettings(){ renderSettings(); openOverlay('settingsOverlay'); }
function renderSettings(){
  const el = $('settingsOverlay'); if (!el) return;
  el.innerHTML = `
    <div class="overlay-header"><button class="back-btn" onclick="closeOverlay('settingsOverlay')" aria-label="Back">${ic.back}</button><div class="overlay-title">Settings</div></div>
    <div class="overlay-body">
      <div class="block"><h4>Appearance</h4>
        <div class="settings-row" style="border-bottom:none;padding-left:0">
          <div class="settings-label"><strong>Theme</strong><span>Match your device, or pick one</span></div>
          <div class="theme-row">
            <button class="theme-opt ${state.theme === 'light' ? 'active' : ''}" onclick="setTheme('light')" aria-label="Light">${ic.sun}</button>
            <button class="theme-opt ${state.theme === 'dark' ? 'active' : ''}" onclick="setTheme('dark')" aria-label="Dark">${ic.moon}</button>
            <button class="theme-opt ${state.theme === 'system' ? 'active' : ''}" onclick="setTheme('system')">Auto</button>
          </div>
        </div>
      </div>
      <div class="block"><h4>Notifications</h4>
        <div class="settings-row" style="border-bottom:none;padding-left:0">
          <div class="settings-label"><strong>Message pop-ups</strong><span>Show a pop-up when a group gets a new message</span></div>
          <button class="switch ${state.notifMessages ? '' : 'off'}" onclick="toggleMsgNotif()" aria-label="Toggle message pop-ups"></button>
        </div>
      </div>
      <div class="block"><h4>Live updates</h4>
        <div class="settings-row" style="border-bottom:none;padding-left:0">
          <div class="settings-label"><strong>Connection</strong><span>New messages, seats and payments update without refreshing</span></div>
          <span id="liveState">${liveLabel()}</span>
        </div>
      </div>
      <div class="block" style="border-bottom:none"><h4>Account</h4>
        <div class="settings-row" style="padding-left:0"><div class="settings-label"><strong>Email</strong><span>${esc(state.session?.user?.email)}</span></div></div>
        <button class="btn btn-outline-danger" style="width:100%;margin-top:14px" onclick="askLogout()">Log out</button>
      </div>
    </div>`;
}
function toggleMsgNotif(){ state.notifMessages = !state.notifMessages; lsSet('cc_notif_msgs', state.notifMessages); renderSettings(); }

/* ============================================================
   REALTIME — RLS only delivers messages from your own groups
   ============================================================ */
let liveStatus = 'connecting', hadDrop = false, liveGen = 0, retryTimer = null, retryDelay = 2000, pollTimer = null, chatPollTimer = null;
function subscribeRealtime(){
  const gen = ++liveGen;
  clearTimeout(retryTimer);
  sb.removeAllChannels();
  try { if (state.session?.access_token) sb.realtime.setAuth(state.session.access_token); } catch (e) {}
  setLive('connecting');
  sb.channel('cc-live')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages' }, async ({ new: m }) => {
      await ensureNames([m.user_id]);
      addMessage(m);
      const c = classById(m.class_id);
      if (c && m.user_id !== uid() && state.openChat !== m.class_id) {
        const who = first(names.get(m.user_id) || 'Someone');
        if (m.kind === 'text') {
          pushNotif(`New message in ${c.title}`, `${who}: ${m.body.slice(0, 80)}`);
          if (state.notifMessages) showToast(`${who} in ${c.title}: ${m.body.slice(0, 40)}`);
        } else if (isHost(c) && /joined/.test(m.body)) {
          pushNotif('New student', `${m.body} “${c.title}”.`);
          showToast(`${who} joined ${c.title}`);
        }
      }
      updateBadges();
      if (['chats','m-chats'].includes(state.tab)) { renderHeader(); renderBody(); }
      if (m.kind === 'system') scheduleReload();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'class_members' }, scheduleReload)
    .on('postgres_changes', { event:'*', schema:'public', table:'classes' }, scheduleReload)
    .on('postgres_changes', { event:'*', schema:'public', table:'bookings' }, ({ eventType, new: b }) => {
      if (b && b.id) {
        const title = classById(b.class_id)?.title || bookingById(b.id)?.class?.title || 'your class';
        const prev = bookingById(b.id);
        if (b.user_id === uid() && prev && prev.status !== b.status) {
          if (b.status === 'paid') { pushNotif('Payment verified', `You’re in “${title}”. Say hi in the group chat!`); showToast('Payment verified. You’re in!'); }
          if (b.status === 'rejected') { pushNotif('Payment rejected', b.admin_note || `Your payment for “${title}” was rejected.`); showToast('Your payment was rejected', true); }
          if (b.status === 'refunded') pushNotif('Refund sent', `Your payment for “${title}” was refunded.`);
        }
        if (isAdmin() && b.status === 'awaiting_payment' && b.claimed_at && !(prev && prev.claimed_at)) {
          pushNotif('Payment to verify', `A student says they paid for “${title}”.`);
          if (state.role === 'admin') showToast('New payment to verify');
        }
        if (prev && prev.class?.host_id === uid() && prev.status !== 'released' && b.status === 'released') pushNotif('Payout sent', `${rupiah(b.amount)} for “${title}” was released to you.`);
      }
      scheduleReload();
    })
    .subscribe((status) => {
      if (gen !== liveGen) return;                       // an older channel we already replaced
      if (status === 'SUBSCRIBED') {
        setLive('live'); retryDelay = 2000;
        if (hadDrop) { hadDrop = false; catchUp(); }     // fetch whatever we missed while offline
      } else if (['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(status)) {
        setLive('offline'); hadDrop = true;
        clearTimeout(retryTimer);
        retryTimer = setTimeout(() => { if (gen === liveGen && state.session) subscribeRealtime(); }, retryDelay);
        retryDelay = Math.min(retryDelay * 2, 30000);
      }
    });
  startPolling();
}

/* ---------- Safety net: never make people refresh ----------
   Realtime pushes changes instantly. If the connection drops
   (phone asleep, tab in background, flaky wifi), we reconnect
   and catch up; while it's down we poll every few seconds. */
function setLive(s){
  liveStatus = s;
  const el = $('liveState'); if (el) el.innerHTML = liveLabel();
}
function liveLabel(){
  return { live:'<span class="pill good">Connected</span>', connecting:'<span class="pill info">Connecting…</span>', offline:'<span class="pill warn">Reconnecting…</span>' }[liveStatus] || '';
}
let catching = false;
async function catchUp(){
  if (catching || !state.loaded || !sb) return;
  catching = true;
  try {
    await reloadAll();
    refreshVisible();
    if (state.openChat) await pullNewMessages(state.openChat);
  } catch (e) {} finally { catching = false; }
}
async function pullNewMessages(cid){
  const lastId = state.chatMsgs.reduce((m, x) => Math.max(m, x.id), 0);
  const { data } = await sb.from('messages').select('id, class_id, user_id, kind, body, created_at')
    .eq('class_id', cid).gt('id', lastId).order('id', { ascending: true }).limit(200);
  if (!data || !data.length || state.openChat !== cid) return;
  await ensureNames(data.map(m => m.user_id));
  data.forEach(addMessage);
}
function startPolling(){
  clearInterval(pollTimer); clearInterval(chatPollTimer);
  // Whole app: every 10s while disconnected, every 60s anyway as a backstop.
  let tick = 0;
  pollTimer = setInterval(() => {
    if (document.visibilityState !== 'visible' || !state.session) return;
    tick++;
    if (liveStatus !== 'live' || tick % 6 === 0) catchUp();
  }, 10000);
  // Open chat: every 4s while disconnected.
  chatPollTimer = setInterval(() => {
    if (document.visibilityState === 'visible' && state.openChat && liveStatus !== 'live') pullNewMessages(state.openChat).catch(() => {});
  }, 4000);
}
function stopLive(){
  liveGen++; clearTimeout(retryTimer); clearInterval(pollTimer); clearInterval(chatPollTimer);
  if (sb) sb.removeAllChannels();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !state.session || !state.loaded) return;
  if (liveStatus !== 'live') subscribeRealtime();
  catchUp();
});
window.addEventListener('online', () => { if (state.session && state.loaded) { subscribeRealtime(); catchUp(); } });
window.addEventListener('offline', () => { hadDrop = true; setLive('offline'); });

/* ============================================================
   BOOT
   ============================================================ */
function showBoot(html){ screenEl.innerHTML = `<div class="boot"><img src="${LOGO}" alt=""><span>${html}</span></div>`; }
function configured(){ return !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_ANON_KEY.startsWith('YOUR-'); }

async function start(session){
  state.session = session; started = true; state.loaded = false;
  state.role = ['student','mentor','admin'].includes(lsGet('cc_role', 'student')) ? lsGet('cc_role', 'student') : 'student';
  state.notifMessages = lsGet('cc_notif_msgs', true);
  state.notifs = lsGet('cc_notifs_' + session.user.id, []);
  state.hasNotif = false;
  renderShell();
  setTab(HOME_TAB[state.role]);
  try {
    await loadMe();
    if (state.role === 'admin' && !isAdmin()) { state.role = 'student'; screenEl.dataset.role = 'student'; renderTabbar(); state.tab = 'discover'; }
    await reloadAll();
  }
  catch (e) {
    $('appBody').innerHTML = `<div class="empty-note">${esc(friendlyError(e))}<br>If this is a new Supabase project, run <b>supabase/schema.sql</b> first.<br><br><button class="btn btn-brand" onclick="location.reload()">Try again</button></div>`;
    return;
  }
  state.loaded = true;
  setTab(state.tab);
  subscribeRealtime();
}

function boot(){
  applyTheme();
  if (!window.supabase) return showBoot('Couldn’t load the Supabase library. Check your connection and reload.');
  if (!configured()) return showBoot('Paste your Supabase URL and key into the <code>CONFIG</code> section at the top of the script in <code>index.html</code>. Setup steps are in README.md.');
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((event, session) => {
    // Supabase advises not awaiting its own calls inside this callback, so defer.
    setTimeout(() => {
      if (event === 'PASSWORD_RECOVERY' || (recovering && session)) { recovering = true; state.session = session; return renderNewPassword(); }
      if (event === 'SIGNED_OUT' || !session) {
        started = false; state.loaded = false; state.session = null; state.me = null; state.classes = []; state.lastMsg = {};
        stopLive(); authMode = 'login'; return renderAuth();
      }
      const switched = state.session && state.session.user.id !== session.user.id;
      state.session = session;
      if (event === 'TOKEN_REFRESHED') { try { sb.realtime.setAuth(session.access_token); } catch (e) {} }
      if (!started || switched) start(session);
    }, 0);
  });
}

// Escape closes whatever is on top: dialog → notifications → top overlay
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const dlg = $('dialog');
  if (dlg && !dlg.hidden) return closeDialog(false);
  const panel = $('notifPanel');
  if (panel && panel.classList.contains('open')) return panel.classList.remove('open');
  const open = [...document.querySelectorAll('.overlay.open')].sort((a, b) => (+b.style.zIndex || 0) - (+a.style.zIndex || 0))[0];
  if (open) closeOverlay(open.id);
});

boot();

</script>
