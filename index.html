<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CourseConnect — Learn from mentors nearby</title>
<meta name="description" content="CourseConnect is a location-aware learning network prototype: browse nearby mentors by skill, message them, and book sessions.">
<meta name="theme-color" content="#3547E0">
<meta property="og:type" content="website">
<meta property="og:title" content="CourseConnect">
<meta property="og:description" content="Find someone to learn from nearby — browse mentors, chat, and book sessions.">
<meta property="og:image" content="assets/logo.png">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --ink:#161829;
    --ink-soft:#5B5F7C;
    --ink-faint:#7B7F9E;
    --paper:#F3F1EC;
    --surface:#FFFFFF;
    --surface-alt:#EDEBFA;
    --brand:#3547E0;
    --brand-deep:#1F2C99;
    --brand-soft:#E4E7FC;
    --accent:#FF6B45;
    --gold:#F0A020;
    --border:#E6E3DB;
    --danger:#E14B4B;
    --good:#1F8A3B;
    --shadow: 0 1px 2px rgba(22,24,41,.05), 0 10px 24px -12px rgba(22,24,41,.18);
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 11px;

    --cat-coding:#3547E0;
    --cat-languages:#0E8272;
    --cat-music:#D9481C;
    --cat-design:#7A2FC0;
    --cat-business:#B9760A;
    --cat-fitness:#1F8A3B;
    --cat-academics:#0E7FA8;
    --cat-photography:#C22A6D;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --ink:#F1F0EC;
      --ink-soft:#B4B6D2;
      --ink-faint:#71749A;
      --paper:#0E0F1B;
      --surface:#181A2C;
      --surface-alt:#22253D;
      --brand:#6C79FF;
      --brand-deep:#AEB6FF;
      --brand-soft:#262A50;
      --accent:#FF8B66;
      --gold:#F3B34A;
      --border:#2C2E48;
      --danger:#FF7373;
      --good:#4FC26B;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 14px 30px -14px rgba(0,0,0,.6);

      --cat-coding:#7C87FF;
      --cat-languages:#3FBFA8;
      --cat-music:#FF8560;
      --cat-design:#C08BF0;
      --cat-business:#F0B24E;
      --cat-fitness:#5FCE7C;
      --cat-academics:#4FC0EA;
      --cat-photography:#F16FA4;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#F1F0EC; --ink-soft:#B4B6D2; --ink-faint:#71749A;
    --paper:#0E0F1B; --surface:#181A2C; --surface-alt:#22253D;
    --brand:#6C79FF; --brand-deep:#AEB6FF; --brand-soft:#262A50;
    --accent:#FF8B66; --gold:#F3B34A; --border:#2C2E48;
    --danger:#FF7373; --good:#4FC26B;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 14px 30px -14px rgba(0,0,0,.6);
    --cat-coding:#7C87FF; --cat-languages:#3FBFA8; --cat-music:#FF8560;
    --cat-design:#C08BF0; --cat-business:#F0B24E; --cat-fitness:#5FCE7C;
    --cat-academics:#4FC0EA; --cat-photography:#F16FA4;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer;}
  ::selection{ background:var(--brand-soft); }

  /* ============================================================
     SECTION 1 — APP SHELL
     Phone frame, status bar, generic header chrome, tab bar,
     overlay scaffolding. Shared by every tab.
     ============================================================ */
  /* ---------- Page shell / scene ---------- */
  .stage{
    min-height:100%;
    display:flex; flex-direction:column; align-items:center;
    gap:28px;
    padding: 40px 20px 56px;
  }
  .scene-header{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    text-align:center; max-width:440px;
  }
  .wordmark{ display:flex; align-items:center; gap:10px; }
  .wordmark img{ width:40px; height:40px; flex:none; object-fit:contain; }
  .wordmark span{ font-size:20px; font-weight:800; letter-spacing:-0.01em; }
  .scene-header p{ margin:0; color:var(--ink-soft); font-size:14.5px; line-height:1.55; }

  .device{
    position:relative;
    width:376px;
    height:clamp(680px, calc(100dvh - 48px), 790px);
    border-radius:52px;
    background:linear-gradient(180deg,#22243A,#0F1020);
    padding:14px;
    box-shadow: 0 30px 60px -20px rgba(15,16,32,.35), 0 2px 0 rgba(255,255,255,.04) inset;
    flex:none;
  }
  .notch{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:120px; height:28px; background:#0F1020; border-radius:0 0 18px 18px; z-index:40;
  }
  .screen{
    position:relative;
    width:100%; height:100%;
    background:var(--surface);
    border-radius:38px;
    overflow:hidden;
    display:flex; flex-direction:column;
  }

  /* ---------- App header ---------- */
  .app-header{
    flex:none;
    padding: calc(42px + env(safe-area-inset-top, 0px)) 18px 12px;
    background:var(--surface);
    border-bottom:1px solid transparent;
  }
  .status-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12px; font-weight:600; color:var(--ink); margin-bottom:10px;
  }
  .header-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .place-pill{
    display:flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:12.5px; font-weight:600;
  }
  .place-pill svg{ width:14px; height:14px; color:var(--brand); }
  .icon-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); display:flex; align-items:center; justify-content:center;
    color:var(--ink); position:relative; flex:none;
  }
  .icon-btn svg{ width:17px; height:17px; }
  .dot-flag{ position:absolute; top:7px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--accent); border:1.5px solid var(--surface); }
  .h1{ font-size:24px; font-weight:800; letter-spacing:-0.015em; margin:12px 0 2px; }
  .h1-sub{ font-size:13px; color:var(--ink-soft); margin:0; }

  /* ============================================================
     SECTION 2 — DISCOVER
     Search bar, category chips, mentor cards + mentor detail
     overlay (profile-hero .. btn-ghost further below), favoriting.
     ============================================================ */
  .search-bar{
    margin-top:14px;
    border:1px solid transparent;
    transition:border-color .15s ease;
  }
  .search-bar:focus-within{ border-color:var(--brand); }
  .search-bar input{
    flex:1; border:none; background:none; outline:none; font-family:inherit;
    font-size:13.5px; color:var(--ink); padding:0;
  }
  .search-bar input::placeholder{ color:var(--ink-faint); }
  .search-bar button{ display:flex; background:none; border:none; padding:0; color:var(--ink-faint); flex:none; }
  .search-bar button svg{ width:15px; height:15px; }
  .search-bar{
    display:flex; align-items:center; gap:8px;
    background:var(--surface-alt); border-radius:14px; padding:11px 13px;
    color:var(--ink-faint);
  }
  .search-bar > svg{ width:16px; height:16px; flex:none; }

  .chip-row{
    display:flex; gap:8px; overflow-x:auto; padding:14px 18px 4px; margin: 0 -18px;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:none; display:flex; align-items:center; gap:6px;
    padding:8px 13px; border-radius:100px; font-size:12.5px; font-weight:700;
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
    white-space:nowrap;
  }
  .chip svg{ width:13px; height:13px; }
  .chip.active{ background:var(--ink); border-color:var(--ink); color:var(--surface); }

  /* ---------- Body / scroll area ---------- */
  .app-body{
    flex:1; overflow-y:auto; padding: 4px 18px 100px;
    scrollbar-width:none;
  }
  .app-body::-webkit-scrollbar{ display:none; }
  .section-label{
    font-size:12.5px; font-weight:700; color:var(--ink-faint); margin:16px 2px 10px;
  }
  .section-label b{ color:var(--ink); font-weight:800; }

  /* ---------- Mentor card ---------- */
  .mentor-card{
    display:flex; gap:12px; align-items:flex-start;
    padding:13px; border-radius:var(--radius-md);
    background:var(--surface); border:1px solid var(--border);
    margin-bottom:10px; text-align:left; width:100%;
  }
  .avatar{
    flex:none; display:flex; align-items:center; justify-content:center;
    border-radius:50%; font-weight:800; color:#fff; font-size:15px; letter-spacing:-0.02em;
  }
  .avatar.md{ width:52px; height:52px; }
  .avatar.lg{ width:78px; height:78px; font-size:24px; border-radius:26px; }
  .avatar.sm{ width:40px; height:40px; font-size:13px; }

  .mentor-main{ flex:1; min-width:0; }
  .mentor-name-row{ display:flex; align-items:center; gap:5px; }
  .mentor-name-row strong{ font-size:14.5px; font-weight:800; letter-spacing:-0.01em; }
  .badge-check{ width:14px; height:14px; color:var(--brand); flex:none; }
  .cat-badge{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11px; font-weight:700; padding:3px 8px; border-radius:100px;
    margin-top:5px;
  }
  .mentor-bio{
    font-size:12.5px; color:var(--ink-soft); margin:7px 0 0; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .mentor-meta{ display:flex; align-items:center; gap:10px; margin-top:9px; font-size:12px; color:var(--ink-soft); font-weight:600; }
  .mentor-meta .stars{ display:flex; align-items:center; gap:3px; color:var(--ink); }
  .mentor-meta svg{ width:13px; height:13px; }
  .mentor-rate{ text-align:right; flex:none; }
  .mentor-rate strong{ display:block; font-size:14px; font-weight:800; color:var(--ink); }
  .mentor-rate span{ font-size:10.5px; color:var(--ink-faint); font-weight:600; }

  .fav-btn{
    position:absolute; bottom:10px; right:10px; width:30px; height:30px; border-radius:50%;
    border:1px solid var(--border); background:var(--surface); display:flex; align-items:center;
    justify-content:center; flex:none; z-index:2; box-shadow:var(--shadow);
  }
  .fav-btn svg{ width:15px; height:15px; color:var(--ink-faint); transition:color .15s ease, transform .15s ease; }
  .fav-btn.on svg{ color:var(--accent); transform:scale(1.08); }
  .mentor-card{ position:relative; cursor:pointer; }

  /* Notification dropdown */
  .notif-panel{
    position:absolute; top:0; right:16px; width:250px; z-index:35;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    box-shadow:var(--shadow); overflow:hidden;
    opacity:0; transform:translateY(-6px); pointer-events:none; visibility:hidden;
    transition:opacity .16s ease, transform .16s ease, visibility 0s linear .16s;
  }
  .notif-panel.open{ opacity:1; transform:translateY(0); pointer-events:auto; visibility:visible; transition-delay:0s; }
  .notif-head{ display:flex; align-items:center; justify-content:space-between; padding-right:10px; border-bottom:1px solid var(--border); }
  .notif-head h5{ margin:0; padding:12px 14px; font-size:12px; font-weight:800; color:var(--ink-faint); }
  .notif-clear{ border:none; background:none; color:var(--brand); font-size:11.5px; font-weight:800; padding:4px 6px; }
  .notif-item{ padding:11px 14px; border-bottom:1px solid var(--border); font-size:12px; line-height:1.5; }
  .notif-item:last-child{ border-bottom:none; }
  .notif-item strong{ display:block; font-size:12.5px; margin-bottom:2px; }
  .notif-item span{ color:var(--ink-faint); font-size:10.5px; font-weight:600; }
  .notif-empty{ padding:22px 14px; text-align:center; color:var(--ink-faint); font-size:12px; font-weight:600; }

  /* ---------- Tab bar ---------- */
  .tabbar{
    flex:none; display:flex; border-top:1px solid var(--border);
    background:var(--surface); padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px));
  }
  .tab-btn{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--ink-faint); padding:4px 0; font-size:10.5px; font-weight:700; position:relative;
  }
  .tab-btn svg{ width:21px; height:21px; }
  .tab-btn.active{ color:var(--brand); }
  .tab-dot{ position:absolute; top:0; right:calc(50% - 16px); width:7px; height:7px; border-radius:50%; background:var(--accent); border:1.5px solid var(--surface); }

  /* ---------- Overlay (profile / chat) ---------- */
  .overlay{
    position:absolute; inset:0; background:var(--surface); z-index:30;
    display:flex; flex-direction:column;
    transform:translateX(100%); visibility:hidden;
    transition:transform .32s cubic-bezier(.22,.9,.35,1), visibility 0s linear .32s;
  }
  .overlay.open{ transform:translateX(0); visibility:visible; transition-delay:0s; }
  .overlay-header{
    flex:none; display:flex; align-items:center; gap:10px; padding:16px 16px 10px;
    border-bottom:1px solid var(--border);
  }
  .back-btn{ width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; flex:none; }
  .back-btn svg{ width:16px; height:16px; }
  .overlay-title{ font-size:15px; font-weight:800; }
  .overlay-body{ flex:1; overflow-y:auto; scrollbar-width:none; }
  .overlay-body::-webkit-scrollbar{ display:none; }

  /* Mentor detail overlay (opened from Discover) */
  .profile-hero{ padding:22px 20px 18px; text-align:center; }
  .profile-hero .rate-tag{
    display:inline-flex; align-items:baseline; gap:3px; background:var(--brand); color:#fff;
    padding:6px 12px; border-radius:100px; font-size:13px; font-weight:800; margin-top:12px;
  }
  .profile-hero .rate-tag span{ font-size:10.5px; font-weight:600; opacity:.85; }
  .stat-row{ display:flex; justify-content:center; gap:26px; padding:16px 20px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
  .stat{ text-align:center; }
  .stat strong{ display:block; font-size:16px; font-weight:800; }
  .stat span{ font-size:11px; color:var(--ink-faint); font-weight:600; }
  .block{ padding:18px 20px; border-bottom:1px solid var(--border); }
  .block h4{ margin:0 0 8px; font-size:12.5px; font-weight:800; color:var(--ink-faint); }
  .block p{ margin:0; font-size:13.5px; line-height:1.6; color:var(--ink); }
  .tag-row{ display:flex; flex-wrap:wrap; gap:7px; }
  .tag{ padding:6px 11px; border-radius:100px; background:var(--surface-alt); font-size:12px; font-weight:700; color:var(--ink); }
  .cta-row{ display:flex; gap:10px; padding:16px 20px 20px; }
  .btn{
    flex:1; border:none; border-radius:14px; padding:13px; font-size:13.5px; font-weight:800;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn svg{ width:15px; height:15px; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-ghost{ background:var(--surface-alt); color:var(--ink); }

  /* ============================================================
     SECTION 3 — CHAT
     Chat list + per-mentor conversation thread, each mentor keeps
     their own independent message history.
     ============================================================ */
  .chat-row{ display:flex; gap:12px; align-items:center; padding:11px 0; width:100%; background:none; border:none; text-align:left; border-bottom:1px solid var(--border); }
  .chat-row:last-child{ border-bottom:none; }
  .chat-text{ flex:1; min-width:0; }
  .chat-top{ display:flex; justify-content:space-between; gap:8px; }
  .chat-top strong{ font-size:13.5px; font-weight:800; }
  .chat-top time{ font-size:11px; color:var(--ink-faint); font-weight:600; }
  .chat-preview{ font-size:12.5px; color:var(--ink-soft); margin:2px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .unread{ width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; margin-top:6px; }

  /* Chat thread */
  .thread{ padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg{ max-width:76%; padding:10px 13px; border-radius:16px; font-size:13px; line-height:1.5; }
  .msg.them{ background:var(--surface-alt); color:var(--ink); border-bottom-left-radius:5px; align-self:flex-start; }
  .msg.me{ background:var(--brand); color:#fff; border-bottom-right-radius:5px; align-self:flex-end; }
  .msg-time{ font-size:10px; color:var(--ink-faint); text-align:center; margin:6px 0; }
  .session-card{
    align-self:center; width:100%; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:13px; text-align:center; margin:6px 0;
  }
  .session-card p{ margin:0 0 8px; font-size:12px; color:var(--ink-soft); font-weight:600; }
  .session-card strong{ font-size:13.5px; }
  .composer{
    flex:none; display:flex; align-items:center; gap:8px; padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--border);
  }
  .composer input{
    flex:1; border:1px solid var(--border); background:var(--surface-alt); border-radius:100px;
    padding:11px 15px; font-size:13px; color:var(--ink); font-family:inherit; outline:none;
  }
  .send-btn{ width:38px; height:38px; border-radius:50%; background:var(--brand); border:none; display:flex; align-items:center; justify-content:center; flex:none; }
  .send-btn svg{ width:16px; height:16px; color:#fff; }

  /* ============================================================
     SECTION 4 — BOOKING
     Month calendar (tap a date to see/plan sessions) + agenda
     lists, plus the "new booking" flow opened from a mentor's page.
     ============================================================ */
  .cal-card{
    border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface);
    padding:14px 14px 8px; margin-bottom:18px;
  }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-head strong{ font-size:13.5px; font-weight:800; }
  .cal-nav{ display:flex; gap:6px; }
  .cal-nav-btn{ width:26px; height:26px; border-radius:50%; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; }
  .cal-nav-btn svg{ width:12px; height:12px; }
  .cal-dow{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10px; font-weight:700; color:var(--ink-faint); margin-bottom:4px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); row-gap:4px; }
  .cal-day{
    position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; border-radius:10px; border:none; background:none; color:var(--ink);
  }
  .cal-day.pad{ visibility:hidden; }
  .cal-day.today{ box-shadow:inset 0 0 0 1.5px var(--brand); }
  .cal-day.selected{ background:var(--ink); color:var(--surface); }
  .cal-day .cal-dot{ position:absolute; bottom:4px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--accent); }
  .cal-day.selected .cal-dot{ background:var(--surface); }
  .cal-day.past-dot .cal-dot{ background:var(--ink-faint); }
  .cal-agenda{ border-top:1px solid var(--border); margin-top:10px; padding:12px 0 6px; }
  .cal-agenda h5{ margin:0 0 8px; font-size:11.5px; font-weight:800; color:var(--ink-faint); }

  /* Bookings */
  .booking-card{
    border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; margin-bottom:10px;
    display:flex; gap:12px; align-items:center;
  }
  .booking-date{
    flex:none; width:48px; text-align:center; background:var(--brand-soft); border-radius:12px; padding:8px 0; color:var(--brand);
  }
  .booking-date strong{ display:block; font-size:16px; font-weight:800; line-height:1; }
  .booking-date span{ font-size:9.5px; font-weight:700; text-transform:uppercase; }
  .booking-info{ flex:1; min-width:0; }
  .booking-info strong{ font-size:13.5px; font-weight:800; display:block; }
  .booking-info p{ margin:3px 0 0; font-size:12px; color:var(--ink-soft); font-weight:600; }
  .booking-actions{ display:flex; gap:6px; margin-top:8px; }
  .mini-btn{ font-size:11px; font-weight:700; padding:6px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); }
  .mini-btn.primary{ background:var(--ink); color:var(--surface); border-color:var(--ink); }

  /* New-booking flow (date + time picker over a mentor) */
  .slot-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .slot-btn{ padding:9px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:12px; font-weight:700; color:var(--ink); }
  .slot-btn.active{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .dur-row{ display:flex; gap:8px; }
  .dur-btn{ flex:1; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:12px; font-weight:700; }
  .dur-btn.active{ background:var(--ink); border-color:var(--ink); color:var(--surface); }

  /* ============================================================
     SECTION 5 — PROFILE
     User data (learning/teaching mode, saved mentors, skill tags)
     and the settings sheet (theme, notifications).
     ============================================================ */
  .profile-top{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:14px 0 6px; }
  .profile-top h3{ margin:12px 0 2px; font-size:17px; font-weight:800; }
  .profile-top p{ margin:0; font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .mode-switch{
    display:flex; background:var(--surface-alt); border-radius:100px; padding:4px; margin:16px 0 4px;
  }
  .mode-btn{ flex:1; border:none; background:none; padding:9px 0; border-radius:100px; font-size:12.5px; font-weight:800; color:var(--ink-soft); }
  .mode-btn.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .field-label{ font-size:11.5px; font-weight:800; color:var(--ink-faint); margin:16px 2px 8px; }
  .field-box{
    border:1px solid var(--border); border-radius:14px; padding:13px; font-size:13px; color:var(--ink-soft);
    background:var(--surface);
  }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:13px; border:1px solid var(--border); border-radius:14px; }
  .toggle-row strong{ font-size:13px; font-weight:700; display:block; }
  .toggle-row span{ font-size:11.5px; color:var(--ink-faint); }
  .switch{ width:40px; height:24px; border-radius:100px; background:var(--good); position:relative; flex:none; border:none; padding:0; }
  .switch::after{ content:''; position:absolute; width:19px; height:19px; border-radius:50%; background:#fff; top:2.5px; right:2.5px; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:right .15s ease, left .15s ease; }
  .switch.off{ background:var(--border); }
  .switch.off::after{ right:auto; left:2.5px; }

  .tag.add-tag{ background:var(--surface); border:1px dashed var(--border); color:var(--ink-faint); cursor:pointer; }
  .settings-row{ display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--border); }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row svg{ width:18px; height:18px; color:var(--ink-soft); flex:none; }
  .settings-row .settings-label{ flex:1; }
  .settings-row .settings-label strong{ display:block; font-size:13px; font-weight:700; }
  .settings-row .settings-label span{ font-size:11.5px; color:var(--ink-faint); }
  .theme-row{ display:flex; gap:6px; background:var(--surface-alt); border-radius:100px; padding:3px; }
  .theme-opt{ padding:6px 11px; border-radius:100px; border:none; background:none; font-size:11px; font-weight:700; color:var(--ink-soft); }
  .theme-opt.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .theme-opt svg{ width:14px; height:14px; display:block; }

  .empty-note{ text-align:center; padding:30px 10px; color:var(--ink-faint); font-size:12.5px; font-weight:600; line-height:1.6; }

  /* Shared toast (feedback for save / send / book actions) */
  .toast{
    position:absolute; left:50%; bottom:96px; transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:var(--surface); font-size:12.5px; font-weight:700;
    padding:10px 16px; border-radius:100px; z-index:60; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;
    box-shadow:var(--shadow);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }


  /* ============================================================
     ADDITIONS — a11y, sorting, dialogs, forms, typing indicator
     ============================================================ */
  :focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  .search-bar input:focus-visible, .composer input:focus-visible,
  .field-input:focus-visible, .rate-box input:focus-visible, .field-area:focus-visible{ outline:none; }
  .search-bar button[hidden]{ display:none; }
  .search-bar button{ cursor:pointer; }
  .search-bar button svg{ width:15px; height:15px; }
  .composer input:focus{ border-color:var(--brand); }
  button:disabled{ cursor:not-allowed; }

  .section-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin:16px 0 10px; }
  .section-row .section-label{ margin:0 2px; }
  .sort-select{
    font-family:inherit; font-size:12px; font-weight:700; color:var(--ink);
    background:var(--surface-alt); border:none; border-radius:100px; padding:7px 12px; cursor:pointer;
  }

  .tab-dot[hidden]{ display:none; }
  .tab-dot{ top:2px; right:calc(50% - 18px); }

  .typing{ display:flex; gap:4px; align-items:center; padding:13px 14px; width:fit-content; }
  .typing i{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); animation:blink 1s infinite ease-in-out; }
  .typing i:nth-child(2){ animation-delay:.15s; }
  .typing i:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.25; transform:translateY(0);} 40%{ opacity:1; transform:translateY(-2px);} }

  .cal-day:disabled{ opacity:.3; }
  .cal-day:not(:disabled):not(.pad):not(.selected):hover{ background:var(--surface-alt); }
  .cal-nav-btn:disabled{ opacity:.35; }
  .cal-nav{ align-items:center; }
  .slot-btn:disabled{ opacity:.38; text-decoration:line-through; }
  .hint{ margin:10px 0 0; font-size:11.5px; color:var(--ink-faint); font-weight:600; line-height:1.5; }
  .hint a{ color:var(--brand); }
  .mini-btn{ cursor:pointer; color:var(--ink); }
  .mini-btn.primary{ color:var(--surface); }
  .mini-btn.danger{ color:var(--danger); }
  .booking-actions{ flex-wrap:wrap; }

  .tag{ display:inline-flex; align-items:center; gap:4px; }
  button.tag{ font-family:inherit; }
  .tag-x{ display:flex; border:none; background:none; padding:0; margin:0 -3px 0 1px; color:var(--ink-faint); }
  .tag-x svg{ width:12px; height:12px; }
  .tag-x:hover{ color:var(--danger); }
  .tag-input{
    border:1px dashed var(--brand); border-radius:100px; padding:6px 11px; font-family:inherit; font-size:12px; font-weight:700;
    color:var(--ink); background:var(--surface); outline:none; width:120px;
  }
  .rate-box{ display:flex; align-items:center; gap:8px; color:var(--ink-faint); font-weight:700; }
  .rate-box input{ flex:1; min-width:0; border:none; background:none; font:inherit; font-weight:800; color:var(--ink); }
  .rate-box:focus-within, .field-area:focus, .field-input:focus{ border-color:var(--brand); }
  .field-area{ display:block; width:100%; min-height:92px; resize:vertical; font-family:inherit; line-height:1.5; color:var(--ink); }
  .field-area::placeholder{ color:var(--ink-faint); }
  .field-input{ display:block; width:100%; font-family:inherit; font-size:13px; color:var(--ink); }
  .char-count{ text-align:right; font-size:11px; color:var(--ink-faint); font-weight:600; margin:4px 4px 0; }

  .btn-danger{ background:var(--danger); color:#fff; }
  .btn:disabled{ opacity:.45; }
  .danger-text{ color:var(--danger); }

  .dialog-backdrop{
    position:absolute; inset:0; z-index:70; background:rgba(15,16,32,.5);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .dialog-backdrop[hidden]{ display:none; }
  .dialog-card{ width:100%; background:var(--surface); border-radius:var(--radius-md); padding:20px; box-shadow:var(--shadow); }
  .dialog-card h4{ margin:0 0 6px; font-size:15px; font-weight:800; }
  .dialog-card p{ margin:0 0 16px; font-size:13px; line-height:1.55; color:var(--ink-soft); }
  .dialog-actions{ display:flex; gap:10px; }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }

  /* ---------- Responsive: real mobile viewers see the screen edge-to-edge ---------- */
  @media (max-width: 560px){
    .scene-header{ display:none; }
    .stage{ padding:0; gap:0; }
    .device{
      width:100vw; height:100dvh; border-radius:0; padding:0; box-shadow:none;
      background:var(--surface);
    }
    .notch{ display:none; }
    .screen{ border-radius:0; height:100dvh; }
  }

  /* ============================================================
     ROLES — Student and Mentor are fully separate spaces
     ============================================================ */
  button{touch-action:manipulation;}
  .screen[data-role="mentor"]{--brand:#0E8272;--brand-deep:#0A5C50;--brand-soft:#DDF1EC;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .screen[data-role="mentor"]{--brand:#3FBFA8;--brand-deep:#8FE0CF;--brand-soft:#16352F;} }
  :root[data-theme="dark"] .screen[data-role="mentor"]{--brand:#3FBFA8;--brand-deep:#8FE0CF;--brand-soft:#16352F;}
  .screen[data-role="mentor"] .app-header{background:linear-gradient(180deg,var(--brand-soft),var(--surface) 85%);}
  .screen[data-role="mentor"] .tabbar{background:var(--brand-soft);border-top-color:transparent;}
  .screen[data-role="mentor"] .btn-primary{background:var(--brand);}
  .role-bar{display:flex;gap:4px;background:var(--surface-alt);border-radius:14px;padding:4px;margin:0 0 10px;}
  .role-bar button{flex:1;border:none;background:none;border-radius:11px;min-height:40px;padding:8px 6px;font-size:12.5px;font-weight:800;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:6px;}
  .role-bar button.on{background:var(--brand);color:#fff;box-shadow:var(--shadow);}
  .role-bar i{font-style:normal;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;}
  .role-bar i[hidden]{display:none;}
  .role-pill{display:inline-block;margin-top:8px;padding:4px 11px;border-radius:100px;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:800;}
  .role-tag{font-size:11px;color:var(--brand);font-weight:700;}
  .role-hint{margin:10px 0 0;text-align:center;font-size:11.5px;color:var(--ink-faint);font-weight:600;}
  .m-card{border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;background:var(--surface);}
  .m-card-top{display:flex;gap:12px;align-items:center;}
  .m-card-top strong{font-size:13.5px;font-weight:800;}
  .m-note{margin:10px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink-soft);}
  .m-actions{display:flex;gap:8px;margin-top:12px;}
  .m-actions .btn{padding:11px;font-size:13px;}

  /* ---------- Mobile polish ---------- */
  @media (max-width: 560px){
    body{padding:0;}
    .app-header{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;}
    .overlay-header{padding-top:calc(12px + env(safe-area-inset-top,0px));}
    .app-body{padding:4px 16px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
    .overlay-body{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
    .chip-row{padding-left:16px;padding-right:16px;margin:0 -16px;}
    .h1{font-size:22px;}
    .icon-btn,.back-btn{width:42px;height:42px;}
    .tabbar{padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));}
    .tab-btn{min-height:54px;justify-content:center;font-size:11px;}
    .tab-dot{top:6px;}
    .btn{min-height:48px;}
    .mini-btn{min-height:36px;padding-left:12px;padding-right:12px;}
    .search-bar input,.composer input,.field-input,.field-area,.rate-box input,.sort-select,.tag-input{font-size:16px;}
    .msg{max-width:85%;}
    .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);white-space:normal;text-align:center;}
    .dialog-card{max-width:400px;}
  }
</style>
</head>

function mentorById(id){ return MENTORS.find(m=>m.id===id); }

function initials(name){ const s = (name||'').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); return s || '?'; }
function starsCompact(){ return `<span class="stars">${ic.star.replace('currentColor','var(--gold)')}</span>`; }
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function friendlyDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
}
function toMin(str){
  const m = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec(str);
  if(!m) return 0;
  let h = parseInt(m[1],10) % 12;
  if(m[3].toUpperCase()==='PM') h += 12;
  return h*60 + parseInt(m[2],10);
}
function relTime(ts, long){
  const diff = Date.now()-ts, m = Math.floor(diff/60000), h = Math.floor(diff/3600000);
  if(m<1) return long ? 'Just now' : 'now';
  if(m<60) return long ? `${m}m ago` : `${m}m`;
  if(h<24) return long ? `${h}h ago` : `${h}h`;
  const day0 = new Date(ts); day0.setHours(0,0,0,0);
  const days = Math.round((TODAY - day0)/DAY_MS);
  if(days<=1) return 'Yesterday';
  if(days<7) return long ? `${days}d ago` : new Date(ts).toLocaleDateString('en-US',{weekday:'short'});
  return new Date(ts).toLocaleDateString('en-US',{month:'short', day:'numeric'});
}
function isUpcoming(x){ return x.date >= ymd(TODAY); }
function bookingTimeLabel(x){ return `${x.start} · ${x.dur} min · ${x.place}`; }
function formatRp(n){ return 'Rp ' + Number(n||0).toLocaleString('en-US'); }

function showToast(msg){

}

/* ---------- Persistence (localStorage, safe if blocked) ---------- */
function persist(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      v:2,
      savedIds:[...state.savedIds], theme:state.theme, hasNotif:state.hasNotif,
      teachingVisible:state.teachingVisible, notifReminders:state.notifReminders, notifMessages:state.notifMessages,
      profile:state.profile, learningTags:state.learningTags, teachingTags:state.teachingTags,
      reminded:[...state.reminded],
      bookings:BOOKINGS, chats:CHATS, threads:THREADS, notifs:NOTIFS,
      role:state.role, mreqs:MREQS, msess:MSESS, mchats:MCHATS, mthreads:MTHREADS,
    }));
  }catch(e){}
}
function loadPersisted(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); }catch(e){}
  if(d && typeof d === 'object'){
    if(Array.isArray(d.savedIds)) state.savedIds = new Set(d.savedIds.filter(id=>mentorById(id)));
    if(['light','dark','system'].includes(d.theme)) state.theme = d.theme;
    ['hasNotif','teachingVisible','notifReminders','notifMessages'].forEach(k=>{ if(typeof d[k]==='boolean') state[k] = d[k]; });
    if(d.profile && typeof d.profile==='object'){
      state.profile = {
        name: typeof d.profile.name==='string' ? d.profile.name : state.profile.name,
        school: typeof d.profile.school==='string' ? d.profile.school : state.profile.school,
        rate: Number.isFinite(d.profile.rate) ? d.profile.rate : state.profile.rate,
        about: typeof d.profile.about==='string' ? d.profile.about : '',
      };
    }
    if(Array.isArray(d.learningTags)) state.learningTags = d.learningTags.filter(t=>typeof t==='string');
    if(Array.isArray(d.teachingTags)) state.teachingTags = d.teachingTags.filter(t=>typeof t==='string');
    if(Array.isArray(d.reminded)) state.reminded = new Set(d.reminded);
    if(Array.isArray(d.bookings)) BOOKINGS = d.bookings.filter(b=>b && mentorById(b.mentorId) && b.date && b.start && b.dur);
    if(Array.isArray(d.chats)) CHATS = d.chats.filter(c=>c && mentorById(c.mentorId));
    if(d.threads && typeof d.threads==='object'){
      THREADS = {};
      Object.keys(d.threads).forEach(k=>{ if(Array.isArray(d.threads[k])) THREADS[k] = d.threads[k]; });
    }
    if(Array.isArray(d.notifs)) NOTIFS = d.notifs;
    if(['student','mentor'].includes(d.role)) state.role = d.role;
    if(Array.isArray(d.mreqs)) MREQS = d.mreqs;
    if(Array.isArray(d.msess)) MSESS = d.msess;
    if(Array.isArray(d.mchats)) MCHATS = d.mchats;
    if(d.mthreads && typeof d.mthreads==='object') MTHREADS = d.mthreads;
  } else {
    // Migrate the two keys used by the original prototype
    try{
      const raw = localStorage.getItem('cc_saved');
      if(raw){ state.savedIds = new Set(JSON.parse(raw)); }
      const theme = localStorage.getItem('cc_theme');
      if(theme) state.theme = theme;
    }catch(e){}
  }
  applyTheme();
}
function applyTheme(){
  const root = document.documentElement;
  if(state.theme==='system') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', state.theme);
}

/* ============================================================
   SECTION 3 — CHAT
   Each mentor keeps an independent thread (see THREADS above),
   so opening a different person's chat always shows only their
   own history — never mixed with anyone else's.
   ============================================================ */
function ensureChat(mentorId){
  let c = CHATS.find(x=>x.mentorId===mentorId);
  if(!c){ c = {mentorId, ts:Date.now(), unread:false}; CHATS.unshift(c); }
  return c;
}
function bumpChatToTop(mentorId){
  const idx = CHATS.findIndex(x=>x.mentorId===mentorId);
  if(idx>0){ const [c] = CHATS.splice(idx,1); CHATS.unshift(c); }
}
function lastMessage(mentorId){
  const t = THREADS[mentorId] || [];
  if(!t.length) return {text:'Say hi 👋', mine:false};
  const last = t[t.length-1];
  if(last.who==='session') return {text:'Session requested', mine:false};
  return {text:last.text, mine:last.who==='me'};
}

function renderChats(b){
  if(!CHATS.length){
    b.innerHTML = `<div class="empty-note">No conversations yet.<br>Message a mentor from their profile to start one.</div>`;
    return;
  }
  b.innerHTML = CHATS.map(c=>{
    const m = mentorById(c.mentorId);
    const last = lastMessage(c.mentorId);
    return `
      <button class="chat-row" onclick="openChat(${c.mentorId})">
        <div class="avatar sm" style="background:${m.color}">${initials(m.name)}</div>
        <div class="chat-text">
          <div class="chat-top"><strong>${m.name}</strong><time>${relTime(c.ts)}</time></div>
          <p class="chat-preview">${last.mine?'You: ':''}${escapeHTML(last.text)}</p>
        </div>
        ${c.unread ? '<span class="unread" aria-label="Unread"></span>' : ''}
      </button>
    `;
  }).join('');
}

function msgHTML(t){
  if(t.who==='session') return `<div class="session-card"><p>Session requested</p><strong>60 min</strong></div>`;
  return `<div class="msg ${t.who}">${escapeHTML(t.text)}</div>`;
}

function openChat(mentorId){
  ensureChat(mentorId).unread = false;
  persist();
  state.openChatMentor = mentorId;
  renderChatOverlay(mentorById(mentorId));
  document.getElementById('chatOverlay').classList.add('open');
  updateBadges();
}
function closeChatOverlay(){
  state.openChatMentor = null;
  closeOverlay('chatOverlay');
  if(state.tab==='chats') renderBody(); else updateBadges();
}

function renderChatOverlay(m){
  THREADS[m.id] = THREADS[m.id] || [];
  const el = document.getElementById('chatOverlay');
  el.innerHTML = `
    <div class="overlay-header">
      <button class="back-btn" onclick="closeChatOverlay()" aria-label="Back">${ic.chevronLeft}</button>
      <div class="avatar sm" style="background:${m.color}">${initials(m.name)}</div>
      <div class="overlay-title">${m.name}</div>
    </div>
    <div class="overlay-body" id="threadScroll">
      <div class="thread" id="threadBody"></div>
    </div>
    <div class="composer">
      <input type="text" id="chatInput" placeholder="Message ${m.name.split(' ')[0]}..." aria-label="Message ${m.name.split(' ')[0]}" autocomplete="off" onkeydown="if(event.key==='Enter')sendMessage(${m.id})" />
      <button class="send-btn" onclick="sendMessage(${m.id})" aria-label="Send message">${ic.send}</button>
    </div>
  `;
  renderThread(m.id);
}
// Re-renders ONLY the message list, so the composer keeps focus (and the mobile keyboard stays open).
function renderThread(mentorId){
  const tb = document.getElementById('threadBody');
  if(!tb) return;
  const t = THREADS[mentorId] || [];
  tb.innerHTML = (t.length ? t.map(msgHTML).join('') : `<div class="empty-note">No messages yet — say hi!</div>`)
    + ((state.pending[mentorId]||0)>0 ? `<div class="msg them typing" aria-label="Typing"><i></i><i></i><i></i></div>` : '');
  const sc = document.getElementById('threadScroll');
  if(sc) sc.scrollTop = sc.scrollHeight;
}

function sendMessage(mentorId){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  const t = THREADS[mentorId] || (THREADS[mentorId] = []);
  t.push({who:'me', text});
  input.value = '';
  ensureChat(mentorId).ts = Date.now();
  bumpChatToTop(mentorId);
  state.pending[mentorId] = (state.pending[mentorId]||0) + 1;
  renderThread(mentorId);
  persist();
  input.focus();

  // Light "mentor is typing" simulation so the chat feels alive
  setTimeout(()=>{
    state.pending[mentorId] = Math.max(0, (state.pending[mentorId]||1) - 1);
    const reply = REPLIES[Math.floor(Math.random()*REPLIES.length)];
    (THREADS[mentorId] = THREADS[mentorId] || []).push({who:'them', text:reply});
    const c = ensureChat(mentorId);
    c.ts = Date.now();
    bumpChatToTop(mentorId);
    if(state.openChatMentor===mentorId){
      renderThread(mentorId);
    } else {
      c.unread = true;
      if(state.notifMessages) pushNotif('New message', `${mentorById(mentorId).name} replied to you.`);
    }
    persist();
    if(state.tab==='chats') renderChats(document.getElementById('appBody'));
    updateBadges();
  }, 1200 + Math.random()*800);
}

/* ============================================================
   SECTION 4 — BOOKING
   A real month calendar: dots mark days with a session, tapping
   a date filters the agenda to that day. "Book session" / "Book
   again" open the date + time picker; "Reschedule" opens the same
   picker but MOVES the existing booking instead of adding a new one.
   Past days are disabled and clashing time slots are greyed out.
   ============================================================ */
function bookingDotsMap(){
  const map = {};
  BOOKINGS.forEach(x=>{ (map[x.date] = map[x.date] || []).push(x); });
  return map;
}
function byWhen(a,b){ return a.date.localeCompare(b.date) || toMin(a.start)-toMin(b.start); }
function upcomingBookings(){ return BOOKINGS.filter(isUpcoming).sort(byWhen); }
function pastBookings(){ return BOOKINGS.filter(x=>!isUpcoming(x)).sort((a,b)=>byWhen(b,a)); }

function buildCalendarHTML(year, month, opts={}){
  const { selectedDate=null, dotsMap={}, onSelect='selectCalDay', minDate=null } = opts;
  const firstDow = new Date(year, month, 1).getDay();
  const numDays = new Date(year, month+1, 0).getDate();
  const todayStr = ymd(TODAY);
  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<button class="cal-day pad" tabindex="-1" aria-hidden="true"></button>`;
  for(let d=1; d<=numDays; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls = 'cal-day';
    if(dateStr===todayStr) cls += ' today';
    if(dateStr===selectedDate) cls += ' selected';
    const hasDots = !!dotsMap[dateStr];
    if(hasDots && dateStr < todayStr) cls += ' past-dot';
    const disabled = minDate && dateStr < minDate;
    cells += `<button class="${cls}" ${disabled?'disabled':''} onclick="${onSelect}('${dateStr}')" aria-label="${friendlyDate(dateStr)}${hasDots?', has a session':''}" ${dateStr===selectedDate?'aria-pressed="true"':''}>${d}${hasDots?'<span class="cal-dot"></span>':''}</button>`;
  }
  return `
    <div class="cal-dow">${['S','M','T','W','T','F','S'].map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
  `;
}

function renderBookings(b){
  const dots = bookingDotsMap();
  const calHTML = buildCalendarHTML(state.calYear, state.calMonth, {selectedDate:state.selectedDate, dotsMap:dots, onSelect:'selectCalDay'});
  const agendaHTML = state.selectedDate ? `
    <div class="cal-agenda">
      <h5>${friendlyDate(state.selectedDate)}</h5>
      ${(dots[state.selectedDate]||[]).length ? dots[state.selectedDate].slice().sort(byWhen).map(bookingHTML).join('') : `<div class="empty-note" style="padding:10px 0">No sessions this day.</div>`}
    </div>` : '';
  const up = upcomingBookings(), past = pastBookings();

  b.innerHTML = `
    <div class="cal-card">
      <div class="cal-head">
        <strong>${MONTHS[state.calMonth]} ${state.calYear}</strong>
        <div class="cal-nav">
          <button class="mini-btn" onclick="goToday()">Today</button>
          <button class="cal-nav-btn" onclick="calNav(-1)" aria-label="Previous month">${ic.chevronLeft}</button>
          <button class="cal-nav-btn" onclick="calNav(1)" aria-label="Next month">${ic.chevronRight}</button>
        </div>
      </div>
      ${calHTML}
      ${agendaHTML}
    </div>
    ${!state.selectedDate ? `
      <div class="section-label"><b>Upcoming</b></div>
      ${up.length ? up.map(bookingHTML).join('') : `<div class="empty-note">Nothing booked yet — find a mentor on Discover.</div>`}
      ${past.length ? `<div class="section-label" style="margin-top:22px"><b>Past</b></div>${past.map(bookingHTML).join('')}` : ''}
    ` : ''}
  `;
}
function selectCalDay(dateStr){ state.selectedDate = (state.selectedDate===dateStr) ? null : dateStr; renderBody(); }
function goToday(){
  state.calYear = TODAY.getFullYear(); state.calMonth = TODAY.getMonth();
  state.selectedDate = ymd(TODAY);
  renderBody();
}
function calNav(delta){
  state.calMonth += delta;
  if(state.calMonth<0){ state.calMonth=11; state.calYear--; }
  if(state.calMonth>11){ state.calMonth=0; state.calYear++; }
  renderBody();
}

function bookingHTML(x){
  const m = mentorById(x.mentorId);
  const d = new Date(x.date+'T00:00:00');
  return `
    <div class="booking-card">
      <div class="booking-date"><strong>${d.getDate()}</strong><span>${MONTHS[d.getMonth()].slice(0,3)}</span></div>
      <div class="booking-info">
        <strong>${m.name}</strong>
        <p>${m.label} · ${bookingTimeLabel(x)}</p>
        ${isUpcoming(x)
          ? `<div class="booking-actions"><button class="mini-btn primary" onclick="openChat(${m.id})">Message</button><button class="mini-btn" onclick="openBooking(${m.id}, '${x.id}')">Reschedule</button><button class="mini-btn danger" onclick="askCancelBooking('${x.id}')">Cancel</button></div>`
          : `<div class="booking-actions"><button class="mini-btn" onclick="openBooking(${m.id})">Book again</button></div>`}
      </div>
    </div>
  `;
}
function askCancelBooking(id){
  const x = BOOKINGS.find(b=>b.id===id);
  if(!x) return;
  const m = mentorById(x.mentorId);
  openDialog({
    title:'Cancel this session?',
    body:`Your session with ${m.name} on ${friendlyDate(x.date)} at ${x.start} will be removed.`,
    confirmLabel:'Cancel session', danger:true
  }, ()=>{
    BOOKINGS = BOOKINGS.filter(b=>b.id!==id);
    pushNotif('Booking cancelled', `Your session with ${m.name} on ${friendlyDate(x.date)} was cancelled.`);
    persist();

// ---- New-booking flow (date + duration + time + format, for one mentor) ----
const TIME_SLOTS = ['9:00 AM','11:00 AM','1:00 PM','3:00 PM','5:00 PM','7:00 PM'];

function openBooking(mentorId, rescheduleId){
  const ex = rescheduleId ? BOOKINGS.find(b=>b.id===rescheduleId) : null;
  const base = ex ? new Date(ex.date+'T00:00:00') : TODAY;
  bookingFlow = {
    mentorId, year:base.getFullYear(), month:base.getMonth(),
    date: ex ? ex.date : null, time: ex ? ex.start : null, dur: ex ? ex.dur : 60,
    mode: ex && ex.place!=='Online' ? 'In person' : 'Online', place: ex ? ex.place : 'Online',
    rescheduleId: ex ? ex.id : null,
  };
  renderBookingOverlay();
  document.getElementById('bookingOverlay').classList.add('open');
}
// Returns a reason string if the slot can't be booked, otherwise ''.
function slotProblem(date, start, dur){
  if(!date) return '';
  const s = toMin(start), e = s + dur;
  if(date === ymd(TODAY)){
    const now = new Date();
    if(s <= now.getHours()*60 + now.getMinutes()) return 'past';
  }
  const clash = BOOKINGS.find(b => b.id!==bookingFlow.rescheduleId && b.date===date && toMin(b.start) < e && s < toMin(b.start)+b.dur);
  return clash ? 'clash' : '';
}
function renderBookingOverlay(){
  const f = bookingFlow;
  const m = mentorById(f.mentorId);
  if(f.time && f.date && slotProblem(f.date, f.time, f.dur)) f.time = null; // selection became invalid (date/duration changed)
  const dots = bookingDotsMap();
  const calHTML = buildCalendarHTML(f.year, f.month, {selectedDate:f.date, dotsMap:dots, onSelect:'pickBookingDate', minDate:ymd(TODAY)});
  const canConfirm = f.date && f.time;
  const atFirstMonth = f.year===TODAY.getFullYear() && f.month===TODAY.getMonth();
  const el = document.getElementById('bookingOverlay');
  el.innerHTML = `
    <div class="overlay-header">
      <button class="back-btn" onclick="closeOverlay('bookingOverlay')" aria-label="Back">${ic.chevronLeft}</button>
      <div class="overlay-title">${f.rescheduleId?'Reschedule':'Book'} ${m.name.split(' ')[0]}</div>
    </div>
    <div class="overlay-body">
      <div class="block">
        <h4>Date</h4>
        <div class="cal-card" style="margin:0; padding:0; border:none;">
          <div class="cal-head">
            <strong>${MONTHS[f.month]} ${f.year}</strong>
            <div class="cal-nav">
              <button class="cal-nav-btn" onclick="bookingCalNav(-1)" aria-label="Previous month" ${atFirstMonth?'disabled':''}>${ic.chevronLeft}</button>
              <button class="cal-nav-btn" onclick="bookingCalNav(1)" aria-label="Next month">${ic.chevronRight}</button>
            </div>
          </div>
          ${calHTML}
        </div>
      </div>
      <div class="block">
        <h4>Duration</h4>
        <div class="dur-row">
          ${[30,45,60].map(d=>`<button class="dur-btn ${f.dur===d?'active':''}" aria-pressed="${f.dur===d}" onclick="pickBookingDur(${d})">${d} min</button>`).join('')}
        </div>
      </div>
      <div class="block">
        <h4>Format</h4>
        <div class="dur-row">
          ${['Online','In person'].map(x=>`<button class="dur-btn ${f.mode===x?'active':''}" aria-pressed="${f.mode===x}" onclick="pickBookingMode('${x}')">${x}</button>`).join('')}
        </div>
      </div>
      <div class="block" style="border-bottom:none;">
        <h4>Time</h4>
        <div class="slot-row">
          ${TIME_SLOTS.map(t=>{
            const bad = slotProblem(f.date, t, f.dur);
            return `<button class="slot-btn ${f.time===t?'active':''}" ${bad?'disabled':''} ${bad?`title="${bad==='past'?'This time has passed':'Clashes with another session'}"`:''} aria-pressed="${f.time===t}" onclick="pickBookingTime('${t}')">${t}</button>`;
          }).join('')}
        </div>
        <p class="hint">${f.date ? 'Greyed-out times have passed or clash with another session.' : 'Pick a date first to see which times are free.'}</p>
      </div>
    </div>
    <div class="cta-row">
      <button class="btn btn-primary" style="flex:1; ${canConfirm?'':'opacity:.45; pointer-events:none;'}" ${canConfirm?'':'disabled'} onclick="confirmBooking()">
        ${canConfirm ? `${f.rescheduleId?'Reschedule':'Confirm'} · ${friendlyDate(f.date)}, ${f.time}` : 'Pick a date and time'}
      </button>
    </div>
  `;
}
function bookingCalNav(delta){
  let y = bookingFlow.year, mo = bookingFlow.month + delta;
  if(mo<0){ mo=11; y--; }
  if(mo>11){ mo=0; y++; }
  if(y < TODAY.getFullYear() || (y===TODAY.getFullYear() && mo < TODAY.getMonth())) return; // can't browse the past
  bookingFlow.year = y; bookingFlow.month = mo;
  renderBookingOverlay();
}
function pickBookingDate(d){ bookingFlow.date = d; renderBookingOverlay(); }
function pickBookingTime(t){ bookingFlow.time = t; renderBookingOverlay(); }
function pickBookingDur(d){ bookingFlow.dur = d; renderBookingOverlay(); }
function pickBookingMode(mode){
  const ex = bookingFlow.rescheduleId ? BOOKINGS.find(b=>b.id===bookingFlow.rescheduleId) : null;
  bookingFlow.mode = mode;
  bookingFlow.place = mode==='Online' ? 'Online' : (ex && ex.place!=='Online' ? ex.place : 'In person');
  renderBookingOverlay();
}
function confirmBooking(){
  const f = bookingFlow;
  if(!f.date || !f.time || slotProblem(f.date, f.time, f.dur)) return;
  const m = mentorById(f.mentorId);
  const rescheduled = !!f.rescheduleId;
  if(rescheduled){
    const b = BOOKINGS.find(x=>x.id===f.rescheduleId);
    if(b) Object.assign(b, {mentorId:f.mentorId, date:f.date, start:f.time, dur:f.dur, place:f.place});
  } else {
    BOOKINGS.push({ id:'b'+Date.now(), mentorId:f.mentorId, date:f.date, start:f.time, dur:f.dur, place:f.place });
  }
  pushNotif(rescheduled ? 'Booking rescheduled' : 'Booking confirmed', `Your session with ${m.name} is set for ${friendlyDate(f.date)}, ${f.time}.`);
  persist();
  closeOverlay('bookingOverlay');
  closeOverlay('profileOverlay');
  state.selectedDate = f.date;
  state.calYear = f.year;
  state.calMonth = f.month;
  setTab('bookings');
  showToast(`${rescheduled?'Rescheduled':'Booked'} with ${m.name.split(' ')[0]} · ${friendlyDate(f.date)}`);
}

/* ============================================================
   SECTION 5 — PROFILE
   Learning/teaching mode, saved mentors (from Discover
   favoriting), editable skill tags / rate / bio, and the
   settings sheet.
   ============================================================ */
function setMode(mode){ state.profileMode = mode; state.addingTag = null; renderBody(); }
function toggleTeachingVisible(){
  state.teachingVisible = !state.teachingVisible;
  persist();
  renderBody();
  showToast(state.teachingVisible ? 'Visible to students' : 'Hidden from students');
}
function tagList(which){ return which==='learning' ? state.learningTags : state.teachingTags; }
function startAddTag(which){
  state.addingTag = which;
  renderBody();
  const i = document.getElementById('tagInput');
  if(i) i.focus();
}
function commitTag(which, val){
  if(state.addingTag !== which) return; // already handled (Enter then blur)
  state.addingTag = null;
  const v = (val||'').trim();
  const list = tagList(which);
  if(v){
    if(list.some(t=>t.toLowerCase()===v.toLowerCase())) showToast('Already in your list');
    else if(list.length>=12) showToast('Up to 12 skills');
    else list.push(v);
    persist();
  }
  renderBody();
}
function tagKey(e, which){
  if(e.key==='Enter'){ e.preventDefault(); commitTag(which, e.target.value); }
  if(e.key==='Escape'){ e.stopPropagation(); state.addingTag = null; renderBody(); }
}
function removeTag(which, i){ tagList(which).splice(i,1); persist(); renderBody(); }
function tagRowHTML(which){
  const adding = state.addingTag===which;
  return `<div class="tag-row">${tagList(which).map((t,i)=>`<span class="tag">${escapeHTML(t)}<button class="tag-x" onclick="removeTag('${which}',${i})" aria-label="Remove ${escapeHTML(t)}">${ic.x}</button></span>`).join('')}${
    adding ? `<input class="tag-input" id="tagInput" maxlength="24" placeholder="New skill" aria-label="New skill" onkeydown="tagKey(event,'${which}')" onblur="commitTag('${which}', this.value)">`
           : `<button class="tag add-tag" onclick="startAddTag('${which}')">+ Add</button>`}</div>`;
}
function setRate(v){
  const n = Math.max(0, parseInt(v,10) || 0);
  state.profile.rate = n;
  persist();
}
function setAbout(v){
  state.profile.about = v;

  if(c) c.textContent = v.length + '/280';
  persist();
}

  b.innerHTML = `

    ${!teach ? `
      <div class="stat-row" style="border:none; padding-top:6px;">
        <div class="stat"><strong>${BOOKINGS.length}</strong><span>Sessions</span></div>
        <div class="stat"><strong>${uniqueMentors}</strong><span>Mentors</span></div>
        <div class="stat"><strong>${state.savedIds.size}</strong><span>Saved</span></div>
      </div>
      <div class="field-label">Skills I'm learning</div>
      ${tagRowHTML('learning')}
      <div class="field-label">Saved mentors</div>
      ${savedMentors.length ? savedMentors.map(m=>`
        <div class="mentor-card" role="button" tabindex="0" style="margin-bottom:8px" onclick="openProfile(${m.id})" onkeydown="cardKey(event,${m.id})">
          <button class="fav-btn on" onclick="toggleFav(${m.id}, event)" aria-label="Remove saved mentor">${ic.heartFill}</button>
          <div class="avatar md" style="background:${m.color}">${initials(m.name)}</div>
          <div class="mentor-main">
            <div class="mentor-name-row"><strong>${m.name}</strong></div>
            <span class="cat-badge" style="background:color-mix(in srgb, var(--cat-${m.cat}) 16%, var(--surface)); color:var(--cat-${m.cat})">${m.label}</span>
          </div>
        </div>
      `).join('') : `<div class="empty-note">Tap the heart on a mentor's card to save them here.</div>`}
    ` : `
      <div class="stat-row" style="border:none; padding-top:6px;">
        <div class="stat"><strong>${new Set(MSESS.map(x=>x.sid)).size}</strong><span>Students</span></div>
        <div class="stat"><strong>—</strong><span>Rating</span></div>
        <div class="stat"><strong>Rp${earned}k</strong><span>Earned</span></div>
      </div>
      <div class="toggle-row" style="margin:4px 2px 0;">
        <div><strong>Visible to students</strong><span>Turn off to pause new requests</span></div>
        <button class="switch ${state.teachingVisible?'':'off'}" role="switch" aria-checked="${state.teachingVisible}" onclick="toggleTeachingVisible()" aria-label="Toggle visibility"></button>
      </div>
      <div class="field-label">Skills I teach</div>
      ${tagRowHTML('teaching')}
      <div class="field-label">Hourly rate</div>
      <label class="field-box rate-box"><span>Rp</span><input type="number" inputmode="numeric" min="0" step="5000" value="${p.rate}" onchange="setRate(this.value)" aria-label="Hourly rate in rupiah"><span>/ hour</span></label>
      <div class="field-label">About what you teach</div>
      <textarea class="field-box field-area" maxlength="280" placeholder="Describe what you're confident teaching and who it's for — this is what mentees see and filter by." aria-label="About what you teach" oninput="setAbout(this.value)">${escapeHTML(p.about)}</textarea>
      <div class="char-count" id="aboutCount">${p.about.length}/280</div>
    `}
  `;
}

function openSettings(){
  renderSettingsOverlay();
  document.getElementById('settingsOverlay').classList.add('open');
}
function setProfileField(key, v){
  state.profile[key] = v;
  persist();
}
function renderSettingsOverlay(){
  const el = document.getElementById('settingsOverlay');
  el.innerHTML = `
    <div class="overlay-header">
      <button class="back-btn" onclick="closeSettings()" aria-label="Back">${ic.chevronLeft}</button>
      <div class="overlay-title">Settings</div>
    </div>
    <div class="overlay-body">
      <div class="block">
        <h4>Account</h4>
        <label class="field-label" for="setName" style="margin-top:0">Display name</label>
        <input id="setName" class="field-box field-input" maxlength="40" value="${escapeHTML(state.profile.name)}" oninput="setProfileField('name', this.value)">
        <label class="field-label" for="setSchool">School / programme</label>
        <input id="setSchool" class="field-box field-input" maxlength="60" value="${escapeHTML(state.profile.school)}" oninput="setProfileField('school', this.value)">
      </div>
      <div class="block">
        <h4>Appearance</h4>
        <div class="settings-row" style="border-bottom:none; padding-left:0;">
          <div class="settings-label"><strong>Theme</strong><span>Match device, or force light / dark</span></div>
          <div class="theme-row">
            <button class="theme-opt ${state.theme==='light'?'active':''}" onclick="setTheme('light')" aria-label="Light">${ic.sun}</button>
            <button class="theme-opt ${state.theme==='dark'?'active':''}" onclick="setTheme('dark')" aria-label="Dark">${ic.moon}</button>
            <button class="theme-opt ${state.theme==='system'?'active':''}" onclick="setTheme('system')" aria-label="Match device">Auto</button>
          </div>
        </div>
      </div>
      <div class="block">
        <h4>Notifications</h4>
        <div class="settings-row" style="border-bottom:none; padding-left:0;">
          <div class="settings-label"><strong>Session reminders</strong><span>Today and tomorrow, for booked sessions</span></div>
          <button class="switch ${state.notifReminders?'':'off'}" role="switch" aria-checked="${state.notifReminders}" onclick="toggleNotifSetting('notifReminders')" aria-label="Toggle session reminders"></button>
        </div>
        <div class="settings-row" style="border-bottom:none; padding-left:0;">
          <div class="settings-label"><strong>New messages</strong><span>When a mentor replies</span></div>
          <button class="switch ${state.notifMessages?'':'off'}" role="switch" aria-checked="${state.notifMessages}" onclick="toggleNotifSetting('notifMessages')" aria-label="Toggle message notifications"></button>
        </div>
      </div>
      <div class="block" style="border-bottom:none;">
        <h4>Data &amp; about</h4>
        <p class="hint" style="margin:0 0 12px">Everything here is saved only in this browser — there's no account or server.</p>
        <button class="btn btn-ghost danger-text" style="width:100%" onclick="askReset()">Reset demo data</button>
        <p class="hint" style="margin:14px 0 0">CourseConnect prototype v${APP_VERSION} · <a href="https://github.com/gloriackusuma/courseconnect" target="_blank" rel="noopener">View on GitHub</a></p>
      </div>
    </div>
  `;
}
function closeSettings(){
  closeOverlay('settingsOverlay');
  if(state.tab==='profile') renderBody(); // pick up a changed name / school
}
function setTheme(mode){
  state.theme = mode;
  applyTheme();
  persist();
  renderSettingsOverlay();
}
function toggleNotifSetting(key){ state[key] = !state[key]; persist(); renderSettingsOverlay(); }
function askReset(){
  openDialog({
    title:'Reset demo data?',
    body:'This clears your saved mentors, bookings, messages and profile edits from this browser and restores the sample data.',
    confirmLabel:'Reset', danger:true
  }, ()=>{
    try{ ['cc_state_v2','cc_saved','cc_theme'].forEach(k=>localStorage.removeItem(k)); }catch(e){}
    location.reload();
  });
}

/* ============================================================
   RENDER: HEADER (per tab)
   ============================================================ */
function renderStudentHeader(){
  const h = document.getElementById('appHeader');
  if(state.tab==='discover'){
    h.innerHTML = `
      <div class="header-top">
        <div class="place-pill">${ic.pin}<span>Kemanggisan, Jakarta Barat</span></div>
        <button class="icon-btn" id="bellBtn" onclick="toggleNotifPanel(event)" aria-label="Notifications">${ic.bell}${state.hasNotif?'<span class="dot-flag"></span>':''}</button>
      </div>
      <div class="h1">Find someone to<br>learn from nearby</div>
      <div class="search-bar">${ic.search}<input id="searchInput" type="text" aria-label="Search a skill or a mentor's name" placeholder="Search a skill or a mentor's name" value="${escapeHTML(state.query)}" oninput="setQuery(this.value)" autocomplete="off"><button id="clearSearch" onclick="clearSearch()" aria-label="Clear search" ${state.query?'':'hidden'}>${ic.x}</button></div>
      <div class="chip-row" id="chipRow"></div>
    `;
    renderChips();
  } else if(state.tab==='chats'){
    const unread = CHATS.filter(c=>c.unread).length;
    h.innerHTML = `<div class="header-top"><div class="h1" style="margin:2px 0 0">Chats</div></div><p class="h1-sub">${unread?`${unread} unread — `:''}Message a mentor before you book, or coordinate a session.</p>`;
  } else if(state.tab==='bookings'){
    h.innerHTML = `<div class="header-top"><div class="h1" style="margin:2px 0 0">Bookings</div></div><p class="h1-sub">Tap a date to see what's on, or browse the lists below.</p>`;
  } else {
    h.innerHTML = `<div class="header-top"><div class="h1" style="margin:2px 0 0">Profile</div><button class="icon-btn" onclick="openSettings()" aria-label="Settings">${ic.gear}</button></div>`;
  }
}

/* ============================================================
   ROLES — separate Student / Mentor spaces
   Each role has its own tabs, colour, data, chats and notifications.
   ============================================================ */
const sv = p => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const TABICON = {
  compass: sv('<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5 5-2z"/>'),
  user: sv('<circle cx="12" cy="8.2" r="3.6"/><path d="M4.5 20c1.4-4 4.2-6 7.5-6s6.1 2 7.5 6"/>'),
  inbox: sv('<path d="M3 13l2.5-7h13L21 13v6H3z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/>'),
};
const TABS = {
  student:[['discover','Discover',TABICON.compass],['chats','Chats',ic.msg,'chatDot'],['bookings','Bookings',ic.calendar],['profile','Profile',TABICON.user]],
  mentor:[['m-home','Requests',TABICON.inbox,'mReqDot'],['m-chats','Students',ic.msg,'mChatDot'],['m-sched','Schedule',ic.calendar],['m-profile','Profile',TABICON.user]],
};
function renderTabbar(){
  const nav = document.getElementById('tabbar');
  nav.setAttribute('aria-label', state.role==='mentor' ? 'Mentor navigation' : 'Student navigation');
  nav.innerHTML = TABS[state.role].map(t=>`<button class="tab-btn" data-tab="${t[0]}" onclick="setTab('${t[0]}')">${t[2]}${t[1]}${t[3]?`<span class="tab-dot" id="${t[3]}" hidden></span>`:''}</button>`).join('');
}
function setRole(r){
  if(r===state.role) return;
  state.role = r; persist();
  ['profileOverlay','chatOverlay','bookingOverlay','settingsOverlay'].forEach(closeOverlay);
  state.openChatMentor = null; state.openChatStudent = null;
  document.getElementById('screen').dataset.role = r;
  renderTabbar();
  setTab(r==='mentor' ? 'm-home' : 'discover');
  showToast(r==='mentor' ? 'Mentor view — you are teaching' : 'Student view — you are learning');
}
function roleBarHTML(){
  const m = state.role==='mentor';
  return `<div class="role-bar" role="tablist" aria-label="Switch between Student and Mentor">
    <button role="tab" class="${m?'':'on'}" aria-selected="${!m}" onclick="setRole('student')">Student<i id="rbS" hidden></i></button>
    <button role="tab" class="${m?'on':''}" aria-selected="${m}" onclick="setRole('mentor')">Mentor<i id="rbM" hidden></i></button>
  </div>`;
}
function updateRoleBadges(){
  const sU = CHATS.filter(c=>c.unread).length, mU = MCHATS.filter(c=>c.unread).length + MREQS.length;
  const set = (id,n,show)=>{ const e = document.getElementById(id); if(e){ e.textContent = n; e.hidden = !(n && show); } };
  set('rbS', sU, state.role!=='student'); set('rbM', mU, state.role!=='mentor');
  const d = document.getElementById('mChatDot'); if(d) d.hidden = !MCHATS.some(c=>c.unread);
  const r = document.getElementById('mReqDot'); if(r) r.hidden = !MREQS.length;
}
function renderHeader(){
  const h = document.getElementById('appHeader');
  if(state.role==='mentor') renderMentorHeader(h); else renderStudentHeader();
  h.insertAdjacentHTML('afterbegin', roleBarHTML());
  updateBadges();
}
function renderMentorHeader(h){
  const T = {'m-home':['Requests','Students who want to learn from you.'],'m-chats':['Students','Conversations with the people you teach.'],'m-sched':['Schedule','Sessions where you are the mentor.'],'m-profile':['Mentor profile','What students see about you.']}[state.tab] || ['Requests',''];
  const act = state.tab==='m-home' ? `<button class="icon-btn" id="bellBtn" onclick="toggleNotifPanel(event)" aria-label="Notifications">${ic.bell}${state.hasNotif?'<span class="dot-flag"></span>':''}</button>`
            : state.tab==='m-profile' ? `<button class="icon-btn" onclick="openSettings()" aria-label="Settings">${ic.gear}</button>` : '';
  h.innerHTML = `<div class="header-top"><div class="h1" style="margin:2px 0 0">${T[0]}</div>${act}</div><p class="h1-sub">${T[1]}</p>`;
}

/* ---------- Mentor: requests, schedule, student chats ---------- */
function sById(id){ return STUDENTS.find(s=>s.id===id) || {id, name:'Student', color:'#888'}; }
function sRowHTML(s, line){ return `<div class="avatar sm" style="background:${s.color}">${initials(s.name)}</div><div class="chat-text"><strong>${escapeHTML(s.name)}</strong><p class="chat-preview">${line}</p></div>`; }
function reqHTML(r){
  const s = sById(r.sid);
  return `<div class="m-card"><div class="m-card-top">${sRowHTML(s, friendlyDate(r.date)+' · '+bookingTimeLabel(r))}</div>
    <p class="m-note">“${escapeHTML(r.note)}”</p>
    <div class="m-actions"><button class="btn btn-ghost" onclick="answerReq('${r.id}',false)">Decline</button><button class="btn btn-primary" onclick="answerReq('${r.id}',true)">Accept</button></div></div>`;
}
function msessHTML(x){
  const s = sById(x.sid), up = isUpcoming(x);
  return `<div class="m-card"><div class="m-card-top">${sRowHTML(s, friendlyDate(x.date)+' · '+bookingTimeLabel(x))}</div>
    ${up ? `<div class="m-actions"><button class="btn btn-ghost" onclick="askCancelMSess('${x.id}')">Cancel</button><button class="btn btn-primary" onclick="openMChat(${x.sid})">${ic.msg}Message</button></div>` : ''}</div>`;
}
function mUpcoming(){ return MSESS.filter(isUpcoming).sort(byWhen); }
function renderMHome(b){
  const up = mUpcoming();
  b.innerHTML = `
    <div class="stat-row" style="border:none;padding-top:6px">
      <div class="stat"><strong>${MREQS.length}</strong><span>Pending</span></div>
      <div class="stat"><strong>${up.length}</strong><span>Upcoming</span></div>
      <div class="stat"><strong>${new Set(MSESS.map(x=>x.sid)).size}</strong><span>Students</span></div>
    </div>
    <div class="section-label"><b>New requests</b></div>
    ${MREQS.length ? MREQS.map(reqHTML).join('') : `<div class="empty-note">No pending requests right now.</div>`}
    <div class="section-label" style="margin-top:20px"><b>Next up</b></div>
    ${up.length ? up.slice(0,2).map(msessHTML).join('') : `<div class="empty-note">No sessions scheduled yet.</div>`}`;
}
function renderMSched(b){
  const up = mUpcoming(), past = MSESS.filter(x=>!isUpcoming(x)).sort((a,c)=>byWhen(c,a));
  b.innerHTML = `<div class="section-label"><b>Upcoming</b></div>
    ${up.length ? up.map(msessHTML).join('') : `<div class="empty-note">Nothing scheduled — accept a request to fill your calendar.</div>`}
    ${past.length ? `<div class="section-label" style="margin-top:22px"><b>Past</b></div>${past.map(msessHTML).join('')}` : ''}`;
}
function answerReq(id, ok){
  const r = MREQS.find(x=>x.id===id); if(!r) return;
  const s = sById(r.sid), start = toMin(r.start), end = start + r.dur;
  if(ok){
    const clash = MSESS.some(x=>x.date===r.date && start < toMin(x.start)+x.dur && toMin(x.start) < end);
    if(clash){ showToast('That time clashes with another session'); return; }
    MSESS.push({id:'s'+Date.now(), sid:r.sid, date:r.date, start:r.start, dur:r.dur, place:r.place});
  }
  MREQS = MREQS.filter(x=>x.id!==id);
  (MTHREADS[r.sid] = MTHREADS[r.sid] || []).push({who:'me', text: ok ? `Accepted — see you ${friendlyDate(r.date)} at ${r.start}.` : "Sorry, I can't make that time. Could you suggest another?"});
  persist(); showToast(ok ? `Accepted ${s.name.split(' ')[0]}'s request` : 'Request declined');
  renderBody();
}
function askCancelMSess(id){
  const x = MSESS.find(v=>v.id===id); if(!x) return;
  openDialog({title:'Cancel this session?', body:`${sById(x.sid).name} will be told you cancelled.`, confirmLabel:'Cancel session', danger:true}, ()=>{
    MSESS = MSESS.filter(v=>v.id!==id); persist(); showToast('Session cancelled'); renderBody();
  });
}
function renderMChats(b){
  b.innerHTML = MCHATS.length ? MCHATS.map(c=>{
    const s = sById(c.sid), t = MTHREADS[c.sid] || [], last = t[t.length-1];
    return `<button class="chat-row" onclick="openMChat(${c.sid})"><div class="avatar sm" style="background:${s.color}">${initials(s.name)}</div>
      <div class="chat-text"><div class="chat-top"><strong>${escapeHTML(s.name)}</strong><time>${relTime(c.ts)}</time></div>
      <p class="chat-preview">${last && last.who==='me' ? 'You: ' : ''}${escapeHTML(last ? last.text : 'Say hi 👋')}</p></div>${c.unread ? '<span class="unread" aria-label="Unread"></span>' : ''}</button>`;
  }).join('') : `<div class="empty-note">No student conversations yet.<br>They'll show up here when someone requests a session.</div>`;
}
function drawMThread(){
  const el = document.getElementById('threadBody'); if(!el) return;
  el.innerHTML = (MTHREADS[state.openChatStudent] || []).map(msgHTML).join('');
  const sc = document.getElementById('threadScroll'); sc.scrollTop = sc.scrollHeight;
}
function openMChat(sid){
  const c = MCHATS.find(x=>x.sid===sid); if(c) c.unread = false;
  persist(); state.openChatStudent = sid;
  const s = sById(sid);
  document.getElementById('chatOverlay').innerHTML = `
    <div class="overlay-header"><button class="back-btn" onclick="closeMChat()" aria-label="Back">${ic.chevronLeft}</button>
      <div class="avatar sm" style="background:${s.color}">${initials(s.name)}</div>
      <div><div class="overlay-title">${escapeHTML(s.name)}</div><div class="role-tag">Your student</div></div></div>
    <div class="overlay-body" id="threadScroll"><div class="thread" id="threadBody"></div></div>
    <div class="composer"><input type="text" id="chatInput" placeholder="Message ${escapeHTML(s.name.split(' ')[0])}..." aria-label="Message" autocomplete="off" onkeydown="if(event.key==='Enter')sendMMsg(${sid})"><button class="send-btn" onclick="sendMMsg(${sid})" aria-label="Send">${ic.send}</button></div>`;
  document.getElementById('chatOverlay').classList.add('open');
  drawMThread(); updateBadges();
}
function closeMChat(){
  state.openChatStudent = null; closeOverlay('chatOverlay');
  if(state.tab==='m-chats') renderBody(); else updateBadges();
}
function sendMMsg(sid){
  const input = document.getElementById('chatInput'), text = input.value.trim();
  if(!text) return;
  (MTHREADS[sid] = MTHREADS[sid] || []).push({who:'me', text});
  input.value = ''; touchMChat(sid); drawMThread(); persist(); input.focus();
  setTimeout(()=>{
    (MTHREADS[sid] = MTHREADS[sid] || []).push({who:'them', text:STUDENT_REPLIES[Math.floor(Math.random()*STUDENT_REPLIES.length)]});
    const c = touchMChat(sid);
    if(state.openChatStudent===sid) drawMThread();
    else { c.unread = true; if(state.notifMessages) pushNotif('New message', `${sById(sid).name} replied.`, 'mentor'); }
    persist();
    if(state.tab==='m-chats') renderMChats(document.getElementById('appBody'));
    updateBadges();
  }, 1200 + Math.random()*800);
}
function touchMChat(sid){
  let i = MCHATS.findIndex(x=>x.sid===sid), c = i>=0 ? MCHATS.splice(i,1)[0] : {sid, unread:false};
  c.ts = Date.now(); MCHATS.unshift(c); return c;
}

/* ============================================================
   INIT
   ============================================================ */
loadPersisted();
checkReminders();
document.getElementById('screen').dataset.role = state.role;
renderTabbar();
setTab(state.role==='mentor' ? 'm-home' : 'discover');

// Close the notification dropdown on any tap outside it
document.getElementById('screen').addEventListener('click', function(e){
  const panel = document.getElementById('notifPanel');
  const bell = document.getElementById('bellBtn');
  if(panel.classList.contains('open') && !panel.contains(e.target) && (!bell || !bell.contains(e.target))){
    panel.classList.remove('open');
  }
});
// Backdrop tap closes the confirm dialog
document.getElementById('dialog').addEventListener('click', function(e){ if(e.target===this) closeDialog(false); });

// Escape closes whatever is on top: dialog → settings → booking → chat → mentor profile → notifications
document.addEventListener('keydown', function(e){
  if(e.key!=='Escape') return;
  if(!document.getElementById('dialog').hidden){ closeDialog(false); return; }
  const open = id => document.getElementById(id).classList.contains('open');
  if(open('settingsOverlay')){ closeSettings(); return; }
  if(open('bookingOverlay')){ closeOverlay('bookingOverlay'); return; }
  if(open('chatOverlay')){ closeChatOverlay(); return; }
  if(open('profileOverlay')){ closeOverlay('profileOverlay'); return; }
  document.getElementById('notifPanel').classList.remove('open');
});

</script>
</body>
</html>
