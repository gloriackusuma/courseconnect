<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CourseConnect — Classes for courses and competitions</title>
<meta name="description" content="Join study classes for your courses and competition mentoring, or host your own. Every class gets its own group chat.">
<meta name="theme-color" content="#3547E0">
<meta property="og:type" content="website">
<meta property="og:title" content="CourseConnect">
<meta property="og:description" content="Join a class, land in its group chat, learn together.">
<meta property="og:image" content="assets/logo.png">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --ink:#161829;
    --ink-soft:#5B5F7C;
    --ink-faint:#7B7F9E;
    --paper:#F3F1EC;
    --surface:#FFFFFF;
    --surface-alt:#EDEBFA;
    --brand:#3547E0;
    --brand-deep:#1F2C99;
    --brand-soft:#E4E7FC;
    --accent:#FF6B45;
    --gold:#F0A020;
    --border:#E6E3DB;
    --danger:#E14B4B;
    --good:#1F8A3B;
    --shadow: 0 1px 2px rgba(22,24,41,.05), 0 10px 24px -12px rgba(22,24,41,.18);
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 11px;

    --cat-coding:#3547E0;
    --cat-languages:#0E8272;
    --cat-music:#D9481C;
    --cat-design:#7A2FC0;
    --cat-business:#B9760A;
    --cat-fitness:#1F8A3B;
    --cat-academics:#0E7FA8;
    --cat-photography:#C22A6D;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --ink:#F1F0EC;
      --ink-soft:#B4B6D2;
      --ink-faint:#71749A;
      --paper:#0E0F1B;
      --surface:#181A2C;
      --surface-alt:#22253D;
      --brand:#6C79FF;
      --brand-deep:#AEB6FF;
      --brand-soft:#262A50;
      --accent:#FF8B66;
      --gold:#F3B34A;
      --border:#2C2E48;
      --danger:#FF7373;
      --good:#4FC26B;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 14px 30px -14px rgba(0,0,0,.6);

      --cat-coding:#7C87FF;
      --cat-languages:#3FBFA8;
      --cat-music:#FF8560;
      --cat-design:#C08BF0;
      --cat-business:#F0B24E;
      --cat-fitness:#5FCE7C;
      --cat-academics:#4FC0EA;
      --cat-photography:#F16FA4;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#F1F0EC; --ink-soft:#B4B6D2; --ink-faint:#71749A;
    --paper:#0E0F1B; --surface:#181A2C; --surface-alt:#22253D;
    --brand:#6C79FF; --brand-deep:#AEB6FF; --brand-soft:#262A50;
    --accent:#FF8B66; --gold:#F3B34A; --border:#2C2E48;
    --danger:#FF7373; --good:#4FC26B;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 14px 30px -14px rgba(0,0,0,.6);
    --cat-coding:#7C87FF; --cat-languages:#3FBFA8; --cat-music:#FF8560;
    --cat-design:#C08BF0; --cat-business:#F0B24E; --cat-fitness:#5FCE7C;
    --cat-academics:#4FC0EA; --cat-photography:#F16FA4;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer;}
  ::selection{ background:var(--brand-soft); }

  /* ============================================================
     SECTION 1 — APP SHELL
     Phone frame, status bar, generic header chrome, tab bar,
     overlay scaffolding. Shared by every tab.
     ============================================================ */
  /* ---------- Page shell / scene ---------- */
  .stage{
    min-height:100%;
    display:flex; flex-direction:column; align-items:center;
    gap:28px;
    padding: 40px 20px 56px;
  }
  .scene-header{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    text-align:center; max-width:440px;
  }
  .wordmark{ display:flex; align-items:center; gap:10px; }
  .wordmark img{ width:40px; height:40px; flex:none; object-fit:contain; }
  .wordmark span{ font-size:20px; font-weight:800; letter-spacing:-0.01em; }
  .scene-header p{ margin:0; color:var(--ink-soft); font-size:14.5px; line-height:1.55; }

  .device{
    position:relative;
    width:376px;
    height:clamp(680px, calc(100dvh - 48px), 790px);
    border-radius:52px;
    background:linear-gradient(180deg,#22243A,#0F1020);
    padding:14px;
    box-shadow: 0 30px 60px -20px rgba(15,16,32,.35), 0 2px 0 rgba(255,255,255,.04) inset;
    flex:none;
  }
  .notch{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:120px; height:28px; background:#0F1020; border-radius:0 0 18px 18px; z-index:40;
  }
  .screen{
    position:relative;
    width:100%; height:100%;
    background:var(--surface);
    border-radius:38px;
    overflow:hidden;
    display:flex; flex-direction:column;
  }

  /* ---------- App header ---------- */
  .app-header{
    flex:none;
    padding: calc(42px + env(safe-area-inset-top, 0px)) 18px 12px;
    background:var(--surface);
    border-bottom:1px solid transparent;
  }
  .status-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12px; font-weight:600; color:var(--ink); margin-bottom:10px;
  }
  .header-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .place-pill{
    display:flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:12.5px; font-weight:600;
  }
  .place-pill svg{ width:14px; height:14px; color:var(--brand); }
  .icon-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); display:flex; align-items:center; justify-content:center;
    color:var(--ink); position:relative; flex:none;
  }
  .icon-btn svg{ width:17px; height:17px; }
  .dot-flag{ position:absolute; top:7px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--accent); border:1.5px solid var(--surface); }
  .h1{ font-size:24px; font-weight:800; letter-spacing:-0.015em; margin:12px 0 2px; }
  .h1-sub{ font-size:13px; color:var(--ink-soft); margin:0; }

  /* ============================================================
     SECTION 2 — DISCOVER
     Search bar, category chips, mentor cards + mentor detail
     overlay (profile-hero .. btn-ghost further below), favoriting.
     ============================================================ */
  .search-bar{
    margin-top:14px;
    border:1px solid transparent;
    transition:border-color .15s ease;
  }
  .search-bar:focus-within{ border-color:var(--brand); }
  .search-bar input{
    flex:1; border:none; background:none; outline:none; font-family:inherit;
    font-size:13.5px; color:var(--ink); padding:0;
  }
  .search-bar input::placeholder{ color:var(--ink-faint); }
  .search-bar button{ display:flex; background:none; border:none; padding:0; color:var(--ink-faint); flex:none; }
  .search-bar button svg{ width:15px; height:15px; }
  .search-bar{
    display:flex; align-items:center; gap:8px;
    background:var(--surface-alt); border-radius:14px; padding:11px 13px;
    color:var(--ink-faint);
  }
  .search-bar > svg{ width:16px; height:16px; flex:none; }

  .chip-row{
    display:flex; gap:8px; overflow-x:auto; padding:14px 18px 4px; margin: 0 -18px;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:none; display:flex; align-items:center; gap:6px;
    padding:8px 13px; border-radius:100px; font-size:12.5px; font-weight:700;
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
    white-space:nowrap;
  }
  .chip svg{ width:13px; height:13px; }
  .chip.active{ background:var(--ink); border-color:var(--ink); color:var(--surface); }

  /* ---------- Body / scroll area ---------- */
  .app-body{
    flex:1; overflow-y:auto; padding: 4px 18px 100px;
    scrollbar-width:none;
  }
  .app-body::-webkit-scrollbar{ display:none; }
  .section-label{
    font-size:12.5px; font-weight:700; color:var(--ink-faint); margin:16px 2px 10px;
  }
  .section-label b{ color:var(--ink); font-weight:800; }

  /* ---------- Mentor card ---------- */
  .mentor-card{
    display:flex; gap:12px; align-items:flex-start;
    padding:13px; border-radius:var(--radius-md);
    background:var(--surface); border:1px solid var(--border);
    margin-bottom:10px; text-align:left; width:100%;
  }
  .avatar{
    flex:none; display:flex; align-items:center; justify-content:center;
    border-radius:50%; font-weight:800; color:#fff; font-size:15px; letter-spacing:-0.02em;
  }
  .avatar.md{ width:52px; height:52px; }
  .avatar.lg{ width:78px; height:78px; font-size:24px; border-radius:26px; }
  .avatar.sm{ width:40px; height:40px; font-size:13px; }

  .mentor-main{ flex:1; min-width:0; }
  .mentor-name-row{ display:flex; align-items:center; gap:5px; }
  .mentor-name-row strong{ font-size:14.5px; font-weight:800; letter-spacing:-0.01em; }
  .badge-check{ width:14px; height:14px; color:var(--brand); flex:none; }
  .cat-badge{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11px; font-weight:700; padding:3px 8px; border-radius:100px;
    margin-top:5px;
  }
  .mentor-bio{
    font-size:12.5px; color:var(--ink-soft); margin:7px 0 0; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .mentor-meta{ display:flex; align-items:center; gap:10px; margin-top:9px; font-size:12px; color:var(--ink-soft); font-weight:600; }
  .mentor-meta .stars{ display:flex; align-items:center; gap:3px; color:var(--ink); }
  .mentor-meta svg{ width:13px; height:13px; }
  .mentor-rate{ text-align:right; flex:none; }
  .mentor-rate strong{ display:block; font-size:14px; font-weight:800; color:var(--ink); }
  .mentor-rate span{ font-size:10.5px; color:var(--ink-faint); font-weight:600; }

  .fav-btn{
    position:absolute; bottom:10px; right:10px; width:30px; height:30px; border-radius:50%;
    border:1px solid var(--border); background:var(--surface); display:flex; align-items:center;
    justify-content:center; flex:none; z-index:2; box-shadow:var(--shadow);
  }
  .fav-btn svg{ width:15px; height:15px; color:var(--ink-faint); transition:color .15s ease, transform .15s ease; }
  .fav-btn.on svg{ color:var(--accent); transform:scale(1.08); }
  .mentor-card{ position:relative; cursor:pointer; }

  /* Notification dropdown */
  .notif-panel{
    position:absolute; top:0; right:16px; width:250px; z-index:35;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    box-shadow:var(--shadow); overflow:hidden;
    opacity:0; transform:translateY(-6px); pointer-events:none; visibility:hidden;
    transition:opacity .16s ease, transform .16s ease, visibility 0s linear .16s;
  }
  .notif-panel.open{ opacity:1; transform:translateY(0); pointer-events:auto; visibility:visible; transition-delay:0s; }
  .notif-head{ display:flex; align-items:center; justify-content:space-between; padding-right:10px; border-bottom:1px solid var(--border); }
  .notif-head h5{ margin:0; padding:12px 14px; font-size:12px; font-weight:800; color:var(--ink-faint); }
  .notif-clear{ border:none; background:none; color:var(--brand); font-size:11.5px; font-weight:800; padding:4px 6px; }
  .notif-item{ padding:11px 14px; border-bottom:1px solid var(--border); font-size:12px; line-height:1.5; }
  .notif-item:last-child{ border-bottom:none; }
  .notif-item strong{ display:block; font-size:12.5px; margin-bottom:2px; }
  .notif-item span{ color:var(--ink-faint); font-size:10.5px; font-weight:600; }
  .notif-empty{ padding:22px 14px; text-align:center; color:var(--ink-faint); font-size:12px; font-weight:600; }

  /* ---------- Tab bar ---------- */
  .tabbar{
    flex:none; display:flex; border-top:1px solid var(--border);
    background:var(--surface); padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px));
  }
  .tab-btn{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--ink-faint); padding:4px 0; font-size:10.5px; font-weight:700; position:relative;
  }
  .tab-btn svg{ width:21px; height:21px; }
  .tab-btn.active{ color:var(--brand); }
  .tab-dot{ position:absolute; top:0; right:calc(50% - 16px); width:7px; height:7px; border-radius:50%; background:var(--accent); border:1.5px solid var(--surface); }

  /* ---------- Overlay (profile / chat) ---------- */
  .overlay{
    position:absolute; inset:0; background:var(--surface); z-index:30;
    display:flex; flex-direction:column;
    transform:translateX(100%); visibility:hidden;
    transition:transform .32s cubic-bezier(.22,.9,.35,1), visibility 0s linear .32s;
  }
  .overlay.open{ transform:translateX(0); visibility:visible; transition-delay:0s; }
  .overlay-header{
    flex:none; display:flex; align-items:center; gap:10px; padding:16px 16px 10px;
    border-bottom:1px solid var(--border);
  }
  .back-btn{ width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; flex:none; }
  .back-btn svg{ width:16px; height:16px; }
  .overlay-title{ font-size:15px; font-weight:800; }
  .overlay-body{ flex:1; overflow-y:auto; scrollbar-width:none; }
  .overlay-body::-webkit-scrollbar{ display:none; }

  /* Mentor detail overlay (opened from Discover) */
  .profile-hero{ padding:22px 20px 18px; text-align:center; }
  .profile-hero .rate-tag{
    display:inline-flex; align-items:baseline; gap:3px; background:var(--brand); color:#fff;
    padding:6px 12px; border-radius:100px; font-size:13px; font-weight:800; margin-top:12px;
  }
  .profile-hero .rate-tag span{ font-size:10.5px; font-weight:600; opacity:.85; }
  .stat-row{ display:flex; justify-content:center; gap:26px; padding:16px 20px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
  .stat{ text-align:center; }
  .stat strong{ display:block; font-size:16px; font-weight:800; }
  .stat span{ font-size:11px; color:var(--ink-faint); font-weight:600; }
  .block{ padding:18px 20px; border-bottom:1px solid var(--border); }
  .block h4{ margin:0 0 8px; font-size:12.5px; font-weight:800; color:var(--ink-faint); }
  .block p{ margin:0; font-size:13.5px; line-height:1.6; color:var(--ink); }
  .tag-row{ display:flex; flex-wrap:wrap; gap:7px; }
  .tag{ padding:6px 11px; border-radius:100px; background:var(--surface-alt); font-size:12px; font-weight:700; color:var(--ink); }
  .cta-row{ display:flex; gap:10px; padding:16px 20px 20px; }
  .btn{
    flex:1; border:none; border-radius:14px; padding:13px; font-size:13.5px; font-weight:800;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn svg{ width:15px; height:15px; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-ghost{ background:var(--surface-alt); color:var(--ink); }

  /* ============================================================
     SECTION 3 — CHAT
     Chat list + per-mentor conversation thread, each mentor keeps
     their own independent message history.
     ============================================================ */
  .chat-row{ display:flex; gap:12px; align-items:center; padding:11px 0; width:100%; background:none; border:none; text-align:left; border-bottom:1px solid var(--border); }
  .chat-row:last-child{ border-bottom:none; }
  .chat-text{ flex:1; min-width:0; }
  .chat-top{ display:flex; justify-content:space-between; gap:8px; }
  .chat-top strong{ font-size:13.5px; font-weight:800; }
  .chat-top time{ font-size:11px; color:var(--ink-faint); font-weight:600; }
  .chat-preview{ font-size:12.5px; color:var(--ink-soft); margin:2px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .unread{ width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; margin-top:6px; }

  /* Chat thread */
  .thread{ padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg{ max-width:76%; padding:10px 13px; border-radius:16px; font-size:13px; line-height:1.5; }
  .msg.them{ background:var(--surface-alt); color:var(--ink); border-bottom-left-radius:5px; align-self:flex-start; }
  .msg.me{ background:var(--brand); color:#fff; border-bottom-right-radius:5px; align-self:flex-end; }
  .msg-time{ font-size:10px; color:var(--ink-faint); text-align:center; margin:6px 0; }
  .session-card{
    align-self:center; width:100%; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:13px; text-align:center; margin:6px 0;
  }
  .session-card p{ margin:0 0 8px; font-size:12px; color:var(--ink-soft); font-weight:600; }
  .session-card strong{ font-size:13.5px; }
  .composer{
    flex:none; display:flex; align-items:center; gap:8px; padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--border);
  }
  .composer input{
    flex:1; border:1px solid var(--border); background:var(--surface-alt); border-radius:100px;
    padding:11px 15px; font-size:13px; color:var(--ink); font-family:inherit; outline:none;
  }
  .send-btn{ width:38px; height:38px; border-radius:50%; background:var(--brand); border:none; display:flex; align-items:center; justify-content:center; flex:none; }
  .send-btn svg{ width:16px; height:16px; color:#fff; }

  /* ============================================================
     SECTION 4 — BOOKING
     Month calendar (tap a date to see/plan sessions) + agenda
     lists, plus the "new booking" flow opened from a mentor's page.
     ============================================================ */
  .cal-card{
    border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface);
    padding:14px 14px 8px; margin-bottom:18px;
  }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-head strong{ font-size:13.5px; font-weight:800; }
  .cal-nav{ display:flex; gap:6px; }
  .cal-nav-btn{ width:26px; height:26px; border-radius:50%; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; }
  .cal-nav-btn svg{ width:12px; height:12px; }
  .cal-dow{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10px; font-weight:700; color:var(--ink-faint); margin-bottom:4px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); row-gap:4px; }
  .cal-day{
    position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; border-radius:10px; border:none; background:none; color:var(--ink);
  }
  .cal-day.pad{ visibility:hidden; }
  .cal-day.today{ box-shadow:inset 0 0 0 1.5px var(--brand); }
  .cal-day.selected{ background:var(--ink); color:var(--surface); }
  .cal-day .cal-dot{ position:absolute; bottom:4px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--accent); }
  .cal-day.selected .cal-dot{ background:var(--surface); }
  .cal-day.past-dot .cal-dot{ background:var(--ink-faint); }
  .cal-agenda{ border-top:1px solid var(--border); margin-top:10px; padding:12px 0 6px; }
  .cal-agenda h5{ margin:0 0 8px; font-size:11.5px; font-weight:800; color:var(--ink-faint); }

  /* Bookings */
  .booking-card{
    border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; margin-bottom:10px;
    display:flex; gap:12px; align-items:center;
  }
  .booking-date{
    flex:none; width:48px; text-align:center; background:var(--brand-soft); border-radius:12px; padding:8px 0; color:var(--brand);
  }
  .booking-date strong{ display:block; font-size:16px; font-weight:800; line-height:1; }
  .booking-date span{ font-size:9.5px; font-weight:700; text-transform:uppercase; }
  .booking-info{ flex:1; min-width:0; }
  .booking-info strong{ font-size:13.5px; font-weight:800; display:block; }
  .booking-info p{ margin:3px 0 0; font-size:12px; color:var(--ink-soft); font-weight:600; }
  .booking-actions{ display:flex; gap:6px; margin-top:8px; }
  .mini-btn{ font-size:11px; font-weight:700; padding:6px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); }
  .mini-btn.primary{ background:var(--ink); color:var(--surface); border-color:var(--ink); }

  /* New-booking flow (date + time picker over a mentor) */
  .slot-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .slot-btn{ padding:9px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:12px; font-weight:700; color:var(--ink); }
  .slot-btn.active{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .dur-row{ display:flex; gap:8px; }
  .dur-btn{ flex:1; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:12px; font-weight:700; }
  .dur-btn.active{ background:var(--ink); border-color:var(--ink); color:var(--surface); }

  /* ============================================================
     SECTION 5 — PROFILE
     User data (learning/teaching mode, saved mentors, skill tags)
     and the settings sheet (theme, notifications).
     ============================================================ */
  .profile-top{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:14px 0 6px; }
  .profile-top h3{ margin:12px 0 2px; font-size:17px; font-weight:800; }
  .profile-top p{ margin:0; font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .mode-switch{
    display:flex; background:var(--surface-alt); border-radius:100px; padding:4px; margin:16px 0 4px;
  }
  .mode-btn{ flex:1; border:none; background:none; padding:9px 0; border-radius:100px; font-size:12.5px; font-weight:800; color:var(--ink-soft); }
  .mode-btn.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .field-label{ font-size:11.5px; font-weight:800; color:var(--ink-faint); margin:16px 2px 8px; }
  .field-box{
    border:1px solid var(--border); border-radius:14px; padding:13px; font-size:13px; color:var(--ink-soft);
    background:var(--surface);
  }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:13px; border:1px solid var(--border); border-radius:14px; }
  .toggle-row strong{ font-size:13px; font-weight:700; display:block; }
  .toggle-row span{ font-size:11.5px; color:var(--ink-faint); }
  .switch{ width:40px; height:24px; border-radius:100px; background:var(--good); position:relative; flex:none; border:none; padding:0; }
  .switch::after{ content:''; position:absolute; width:19px; height:19px; border-radius:50%; background:#fff; top:2.5px; right:2.5px; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:right .15s ease, left .15s ease; }
  .switch.off{ background:var(--border); }
  .switch.off::after{ right:auto; left:2.5px; }

  .tag.add-tag{ background:var(--surface); border:1px dashed var(--border); color:var(--ink-faint); cursor:pointer; }
  .settings-row{ display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--border); }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row svg{ width:18px; height:18px; color:var(--ink-soft); flex:none; }
  .settings-row .settings-label{ flex:1; }
  .settings-row .settings-label strong{ display:block; font-size:13px; font-weight:700; }
  .settings-row .settings-label span{ font-size:11.5px; color:var(--ink-faint); }
  .theme-row{ display:flex; gap:6px; background:var(--surface-alt); border-radius:100px; padding:3px; }
  .theme-opt{ padding:6px 11px; border-radius:100px; border:none; background:none; font-size:11px; font-weight:700; color:var(--ink-soft); }
  .theme-opt.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .theme-opt svg{ width:14px; height:14px; display:block; }

  .empty-note{ text-align:center; padding:30px 10px; color:var(--ink-faint); font-size:12.5px; font-weight:600; line-height:1.6; }

  /* Shared toast (feedback for save / send / book actions) */
  .toast{
    position:absolute; left:50%; bottom:96px; transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:var(--surface); font-size:12.5px; font-weight:700;
    padding:10px 16px; border-radius:100px; z-index:60; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;
    box-shadow:var(--shadow);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }


  /* ============================================================
     ADDITIONS — a11y, sorting, dialogs, forms, typing indicator
     ============================================================ */
  :focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  .search-bar input:focus-visible, .composer input:focus-visible,
  .field-input:focus-visible, .rate-box input:focus-visible, .field-area:focus-visible{ outline:none; }
  .search-bar button[hidden]{ display:none; }
  .search-bar button{ cursor:pointer; }
  .search-bar button svg{ width:15px; height:15px; }
  .composer input:focus{ border-color:var(--brand); }
  button:disabled{ cursor:not-allowed; }

  .section-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin:16px 0 10px; }
  .section-row .section-label{ margin:0 2px; }
  .sort-select{
    font-family:inherit; font-size:12px; font-weight:700; color:var(--ink);
    background:var(--surface-alt); border:none; border-radius:100px; padding:7px 12px; cursor:pointer;
  }

  .tab-dot[hidden]{ display:none; }
  .tab-dot{ top:2px; right:calc(50% - 18px); }

  .typing{ display:flex; gap:4px; align-items:center; padding:13px 14px; width:fit-content; }
  .typing i{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); animation:blink 1s infinite ease-in-out; }
  .typing i:nth-child(2){ animation-delay:.15s; }
  .typing i:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.25; transform:translateY(0);} 40%{ opacity:1; transform:translateY(-2px);} }

  .cal-day:disabled{ opacity:.3; }
  .cal-day:not(:disabled):not(.pad):not(.selected):hover{ background:var(--surface-alt); }
  .cal-nav-btn:disabled{ opacity:.35; }
  .cal-nav{ align-items:center; }
  .slot-btn:disabled{ opacity:.38; text-decoration:line-through; }
  .hint{ margin:10px 0 0; font-size:11.5px; color:var(--ink-faint); font-weight:600; line-height:1.5; }
  .hint a{ color:var(--brand); }
  .mini-btn{ cursor:pointer; color:var(--ink); }
  .mini-btn.primary{ color:var(--surface); }
  .mini-btn.danger{ color:var(--danger); }
  .booking-actions{ flex-wrap:wrap; }

  .tag{ display:inline-flex; align-items:center; gap:4px; }
  button.tag{ font-family:inherit; }
  .tag-x{ display:flex; border:none; background:none; padding:0; margin:0 -3px 0 1px; color:var(--ink-faint); }
  .tag-x svg{ width:12px; height:12px; }
  .tag-x:hover{ color:var(--danger); }
  .tag-input{
    border:1px dashed var(--brand); border-radius:100px; padding:6px 11px; font-family:inherit; font-size:12px; font-weight:700;
    color:var(--ink); background:var(--surface); outline:none; width:120px;
  }
  .rate-box{ display:flex; align-items:center; gap:8px; color:var(--ink-faint); font-weight:700; }
  .rate-box input{ flex:1; min-width:0; border:none; background:none; font:inherit; font-weight:800; color:var(--ink); }
  .rate-box:focus-within, .field-area:focus, .field-input:focus{ border-color:var(--brand); }
  .field-area{ display:block; width:100%; min-height:92px; resize:vertical; font-family:inherit; line-height:1.5; color:var(--ink); }
  .field-area::placeholder{ color:var(--ink-faint); }
  .field-input{ display:block; width:100%; font-family:inherit; font-size:13px; color:var(--ink); }
  .char-count{ text-align:right; font-size:11px; color:var(--ink-faint); font-weight:600; margin:4px 4px 0; }

  .btn-danger{ background:var(--danger); color:#fff; }
  .btn:disabled{ opacity:.45; }
  .danger-text{ color:var(--danger); }

  .dialog-backdrop{
    position:absolute; inset:0; z-index:70; background:rgba(15,16,32,.5);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .dialog-backdrop[hidden]{ display:none; }
  .dialog-card{ width:100%; background:var(--surface); border-radius:var(--radius-md); padding:20px; box-shadow:var(--shadow); }
  .dialog-card h4{ margin:0 0 6px; font-size:15px; font-weight:800; }
  .dialog-card p{ margin:0 0 16px; font-size:13px; line-height:1.55; color:var(--ink-soft); }
  .dialog-actions{ display:flex; gap:10px; }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }

  /* ---------- Responsive: real mobile viewers see the screen edge-to-edge ---------- */
  @media (max-width: 560px){
    .scene-header{ display:none; }
    .stage{ padding:0; gap:0; }
    .device{
      width:100vw; height:100dvh; border-radius:0; padding:0; box-shadow:none;
      background:var(--surface);
    }
    .notch{ display:none; }
    .screen{ border-radius:0; height:100dvh; }
  }

  /* ============================================================
     ROLES — Student and Mentor are fully separate spaces
     ============================================================ */
  button{touch-action:manipulation;}
  .screen[data-role="mentor"]{--brand:#0E8272;--brand-deep:#0A5C50;--brand-soft:#DDF1EC;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .screen[data-role="mentor"]{--brand:#3FBFA8;--brand-deep:#8FE0CF;--brand-soft:#16352F;} }
  :root[data-theme="dark"] .screen[data-role="mentor"]{--brand:#3FBFA8;--brand-deep:#8FE0CF;--brand-soft:#16352F;}
  .screen[data-role="mentor"] .app-header{background:linear-gradient(180deg,var(--brand-soft),var(--surface) 85%);}
  .screen[data-role="mentor"] .tabbar{background:var(--brand-soft);border-top-color:transparent;}
  .screen[data-role="mentor"] .btn-primary{background:var(--brand);}
  .role-bar{display:flex;gap:4px;background:var(--surface-alt);border-radius:14px;padding:4px;margin:0 0 10px;}
  .role-bar button{flex:1;border:none;background:none;border-radius:11px;min-height:40px;padding:8px 6px;font-size:12.5px;font-weight:800;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:6px;}
  .role-bar button.on{background:var(--brand);color:#fff;box-shadow:var(--shadow);}
  .role-bar i{font-style:normal;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;}
  .role-bar i[hidden]{display:none;}
  .role-pill{display:inline-block;margin-top:8px;padding:4px 11px;border-radius:100px;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:800;}
  .role-tag{font-size:11px;color:var(--brand);font-weight:700;}
  .role-hint{margin:10px 0 0;text-align:center;font-size:11.5px;color:var(--ink-faint);font-weight:600;}
  .m-card{border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;background:var(--surface);}
  .m-card-top{display:flex;gap:12px;align-items:center;}
  .m-card-top strong{font-size:13.5px;font-weight:800;}
  .m-note{margin:10px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink-soft);}
  .m-actions{display:flex;gap:8px;margin-top:12px;}
  .m-actions .btn{padding:11px;font-size:13px;}

  /* ---------- Mobile polish ---------- */
  @media (max-width: 560px){
    body{padding:0;}
    .app-header{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;}
    .overlay-header{padding-top:calc(12px + env(safe-area-inset-top,0px));}
    .app-body{padding:4px 16px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
    .overlay-body{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
    .chip-row{padding-left:16px;padding-right:16px;margin:0 -16px;}
    .h1{font-size:22px;}
    .icon-btn,.back-btn{width:42px;height:42px;}
    .tabbar{padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));}
    .tab-btn{min-height:54px;justify-content:center;font-size:11px;}
    .tab-dot{top:6px;}
    .btn{min-height:48px;}
    .mini-btn{min-height:36px;padding-left:12px;padding-right:12px;}
    .search-bar input,.composer input,.field-input,.field-area,.rate-box input,.sort-select,.tag-input{font-size:16px;}
    .msg{max-width:85%;}
    .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);white-space:normal;text-align:center;}
    .dialog-card{max-width:400px;}
  }

  /* ============================================================
     LIVE APP — auth, class cards, class detail, forms, group chat
     (added on top of the prototype styles above)
     ============================================================ */
  .btn-brand{ background:var(--brand); color:#fff; }
  .btn-outline-danger{ background:transparent; color:var(--danger); border:1px solid var(--border); }
  .screen[data-role="mentor"] .btn-brand{ background:var(--brand); }

  /* Boot + auth */
  .boot{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:30px; text-align:center; color:var(--ink-faint); font-size:13px; font-weight:700; line-height:1.6; }
  .boot img{ width:60px; height:60px; object-fit:contain; }
  .boot code{ background:var(--surface-alt); color:var(--ink); padding:2px 6px; border-radius:6px; font-size:12px; }
  .auth{ flex:1; overflow-y:auto; padding:calc(56px + env(safe-area-inset-top,0px)) 24px 28px; display:flex; flex-direction:column; }
  .auth img.auth-logo{ width:64px; height:64px; object-fit:contain; }
  .auth h1{ font-size:25px; font-weight:800; letter-spacing:-0.02em; margin:16px 0 6px; line-height:1.2; }
  .auth .lead{ margin:0 0 20px; color:var(--ink-soft); font-size:13.5px; line-height:1.55; }
  .auth-switch{ margin-top:16px; font-size:13px; color:var(--ink-soft); text-align:center; line-height:2; }
  .link-btn{ background:none; border:none; padding:0; color:var(--brand); font-weight:800; font-size:inherit; }

  /* Forms */
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:13px; }
  .field > label{ font-size:12px; font-weight:800; color:var(--ink-soft); }
  .field .sub{ font-size:11.5px; color:var(--ink-faint); font-weight:600; }
  .input{
    width:100%; border:1px solid var(--border); background:var(--surface); color:var(--ink);
    border-radius:12px; padding:12px 13px; font-size:14px; font-family:inherit; outline:none;
  }
  .input:focus{ border-color:var(--brand); }
  textarea.input{ resize:vertical; min-height:84px; line-height:1.5; }
  .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .seg{ display:flex; background:var(--surface-alt); border-radius:12px; padding:4px; }
  .seg button{ flex:1; border:none; background:none; padding:9px 0; border-radius:9px; font-size:12.5px; font-weight:800; color:var(--ink-soft); }
  .seg button.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .form-error{ color:var(--danger); font-size:12.5px; font-weight:700; margin:2px 0 10px; min-height:1em; }
  .form-note{ background:var(--brand-soft); color:var(--brand-deep); border-radius:12px; padding:12px 13px; font-size:12.5px; line-height:1.5; font-weight:600; margin-bottom:16px; }
  .pad{ padding:18px; }

  /* Class card */
  .class-card{
    display:flex; gap:13px; width:100%; text-align:left; padding:13px; margin-bottom:10px; color:var(--ink);
    border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface); font-family:inherit;
  }
  .date-block{ flex:none; align-self:flex-start; width:52px; border-radius:13px; padding:8px 0; text-align:center; background:var(--brand-soft); color:var(--brand-deep); }
  .date-block.competition{ background:color-mix(in srgb, var(--accent) 16%, var(--surface)); color:var(--accent); }
  .date-block strong{ display:block; font-size:19px; font-weight:800; line-height:1; }
  .date-block span{ display:block; font-size:10.5px; font-weight:800; margin-top:3px; }
  .date-block em{ display:block; font-style:normal; font-size:10px; font-weight:700; margin-top:4px; opacity:.85; }
  .class-main{ flex:1; min-width:0; }
  .class-title{ font-size:14.5px; font-weight:800; letter-spacing:-0.01em; line-height:1.3; margin:0; }
  .kind-badge{ display:inline-block; font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:100px; margin-top:6px; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; vertical-align:top; }
  .kind-badge.course{ background:color-mix(in srgb, var(--brand) 14%, var(--surface)); color:var(--brand); }
  .kind-badge.competition{ background:color-mix(in srgb, var(--accent) 16%, var(--surface)); color:var(--accent); }
  .class-meta{ margin:7px 0 0; font-size:12px; color:var(--ink-soft); font-weight:600; line-height:1.6; }
  .class-meta span{ display:flex; align-items:center; gap:5px; min-width:0; }
  .class-meta span b{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .class-meta svg{ width:12px; height:12px; flex:none; color:var(--ink-faint); }
  .class-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:9px; }
  .seats{ flex:1; min-width:0; }
  .seats-bar{ height:5px; border-radius:10px; background:var(--surface-alt); overflow:hidden; }
  .seats-bar i{ display:block; height:100%; background:var(--brand); border-radius:10px; }
  .seats-bar.full i{ background:var(--ink-faint); }
  .seats small{ display:block; font-size:11px; font-weight:700; color:var(--ink-faint); margin-top:4px; }
  .price{ font-size:13.5px; font-weight:800; white-space:nowrap; }
  .mine-tag{ color:var(--good); }

  /* Class detail */
  .detail-hero{ padding:20px 20px 16px; }
  .detail-hero h2{ font-size:21px; font-weight:800; letter-spacing:-0.015em; margin:8px 0 0; line-height:1.25; overflow-wrap:anywhere; }
  .facts{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--border); border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
  .fact{ background:var(--surface); padding:12px 20px; }
  .fact span{ display:block; font-size:11px; font-weight:700; color:var(--ink-faint); }
  .fact strong{ display:block; font-size:13.5px; font-weight:800; margin-top:3px; overflow-wrap:anywhere; }
  .block p.pre{ white-space:pre-wrap; overflow-wrap:anywhere; }
  .person-row{ display:flex; align-items:center; gap:11px; padding:6px 0; }
  .person-row strong{ font-size:13.5px; font-weight:800; display:block; }
  .person-row span{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .avatar.xs{ width:30px; height:30px; font-size:11px; }
  .cta-row{ flex:none; border-top:1px solid var(--border); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px)); }

  /* Mentor home */
  .create-cta{ width:100%; display:flex; align-items:center; gap:12px; text-align:left; border:1.5px dashed var(--brand); background:var(--brand-soft); color:var(--brand-deep); border-radius:var(--radius-md); padding:14px; margin:6px 0 4px; font-family:inherit; }
  .create-cta .plus{ width:38px; height:38px; border-radius:12px; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; flex:none; }
  .create-cta .plus svg{ width:18px; height:18px; }
  .create-cta strong{ display:block; font-size:14px; font-weight:800; }
  .create-cta span{ font-size:12px; font-weight:600; opacity:.85; }

  /* Group chat */
  .group-icon{ width:44px; height:44px; border-radius:14px; flex:none; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#fff; }
  .group-icon.sm{ width:38px; height:38px; border-radius:12px; }
  .chat-top strong{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chat-top time{ flex:none; }
  .chat-row .unread{ margin-top:0; }
  .head-btn{ background:none; border:none; padding:0; text-align:left; min-width:0; color:var(--ink); font-family:inherit; }
  .overlay-sub{ font-size:11.5px; color:var(--ink-faint); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .overlay-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .thread{ gap:3px; }
  .bubble-wrap{ display:flex; flex-direction:column; max-width:80%; margin-top:6px; }
  .bubble-wrap.me{ align-self:flex-end; align-items:flex-end; }
  .bubble-wrap.them{ align-self:flex-start; align-items:flex-start; }
  .bubble-wrap.cont{ margin-top:2px; }
  .bubble-author{ font-size:11px; font-weight:800; color:var(--ink-soft); margin:0 0 3px 4px; }
  .bubble{ padding:9px 13px; border-radius:16px; font-size:13.5px; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere; }
  .bubble-wrap.them .bubble{ background:var(--surface-alt); color:var(--ink); border-bottom-left-radius:5px; }
  .bubble-wrap.me .bubble{ background:var(--brand); color:#fff; border-bottom-right-radius:5px; }
  .bubble-time{ font-size:10px; color:var(--ink-faint); margin:3px 4px 0; font-weight:600; }
  .sys-msg{ align-self:center; font-size:11.5px; color:var(--ink-faint); font-weight:700; background:var(--surface-alt); padding:5px 11px; border-radius:100px; margin:8px 0; text-align:center; }
  .day-sep{ align-self:center; font-size:11px; color:var(--ink-faint); font-weight:800; margin:12px 0 4px; }
  .composer{ align-items:flex-end; }
  .composer textarea{
    flex:1; border:1px solid var(--border); background:var(--surface-alt); color:var(--ink); border-radius:20px;
    padding:10px 15px; font-size:14px; font-family:inherit; outline:none; resize:none; max-height:110px; line-height:1.4;
  }
  .composer textarea:focus{ border-color:var(--brand); }
  .loading{ display:flex; align-items:center; justify-content:center; padding:40px 0; color:var(--ink-faint); font-size:13px; font-weight:700; }
  .toast{ white-space:normal; max-width:86%; text-align:center; }
  .toast.error{ background:var(--danger); color:#fff; }
  @media (max-width: 560px){
    .input, .composer textarea{ font-size:16px; }
    .auth{ padding-top:calc(36px + env(safe-area-inset-top,0px)); }
  }

  /* ---------- Admin role colour ---------- */
  .screen[data-role="admin"]{--brand:#6B2FB3;--brand-deep:#4A1F7D;--brand-soft:#EEE5FA;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .screen[data-role="admin"]{--brand:#B98AF0;--brand-deep:#DCC4FA;--brand-soft:#2E2347;} }
  :root[data-theme="dark"] .screen[data-role="admin"]{--brand:#B98AF0;--brand-deep:#DCC4FA;--brand-soft:#2E2347;}
  .screen[data-role="admin"] .app-header{background:linear-gradient(180deg,var(--brand-soft),var(--surface) 85%);}
  .screen[data-role="admin"] .tabbar{background:var(--brand-soft);border-top-color:transparent;}
  .role-bar button{ min-width:0; }

  /* ---------- Payment ---------- */
  .pill{ flex:none; display:inline-block; font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:100px; white-space:nowrap; }
  .pill.warn{ background:color-mix(in srgb, var(--gold) 20%, var(--surface)); color:color-mix(in srgb, var(--gold) 70%, var(--ink)); }
  .pill.info{ background:var(--brand-soft); color:var(--brand-deep); }
  .pill.good{ background:color-mix(in srgb, var(--good) 15%, var(--surface)); color:var(--good); }
  .pill.bad{ background:color-mix(in srgb, var(--danger) 14%, var(--surface)); color:var(--danger); }
  .pill.muted{ background:var(--surface-alt); color:var(--ink-faint); }
  .block p .pill{ margin-right:4px; vertical-align:1px; }
  .pay-amount{ text-align:center; padding:6px 0 16px; }
  .pay-amount span{ display:block; font-size:12px; font-weight:700; color:var(--ink-faint); }
  .pay-amount strong{ display:block; font-size:30px; font-weight:800; letter-spacing:-0.02em; margin:4px 0 2px; }
  .pay-amount small{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .va-box{ display:flex; align-items:center; justify-content:space-between; gap:10px; border:1.5px dashed var(--brand); background:var(--brand-soft); border-radius:var(--radius-md); padding:14px 16px; }
  .va-box span{ display:block; font-size:11.5px; font-weight:800; color:var(--brand-deep); }
  .va-box strong{ display:block; font-size:19px; font-weight:800; letter-spacing:.04em; margin-top:4px; font-variant-numeric:tabular-nums; }
  .pay-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:12px 2px 14px; font-size:12px; color:var(--ink-soft); font-weight:600; }
  .form-note.bad{ background:color-mix(in srgb, var(--danger) 12%, var(--surface)); color:var(--danger); }
  .pay-steps{ list-style:none; counter-reset:s; padding:0; margin:4px 0 0; }
  .pay-steps li{ counter-increment:s; display:flex; align-items:center; gap:10px; padding:8px 0; font-size:13px; font-weight:600; color:var(--ink-faint); }
  .pay-steps li::before{ content:counter(s); width:24px; height:24px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; background:var(--surface-alt); color:var(--ink-faint); }
  .pay-steps li.done{ color:var(--ink-soft); }
  .pay-steps li.done::before{ content:'✓'; background:var(--good); color:#fff; }
  .pay-steps li.now{ color:var(--ink); font-weight:800; }
  .pay-steps li.now::before{ background:var(--brand); color:#fff; }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:5px 12px; margin-top:12px; font-size:12px; }
  .kv span{ color:var(--ink-faint); font-weight:700; }
  .kv b{ font-weight:700; color:var(--ink); overflow-wrap:anywhere; }
  .m-card-top .chat-text strong{ display:block; }
  .earn-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:4px 0 6px; }
  .earn-row div{ background:var(--surface-alt); border-radius:14px; padding:11px 13px; }
  .earn-row span{ display:block; font-size:11px; font-weight:700; color:var(--ink-faint); }
  .earn-row strong{ display:block; font-size:15px; font-weight:800; margin-top:3px; }
  .pad .btn{ width:100%; }
  .dialog-backdrop{ z-index:1000; }
  .toast{ z-index:1001; }
  .notif-panel{ z-index:900; }
</style>
</head>

/* ============================================================
   HELPERS
   ============================================================ */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(n){ return String(n || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase() || '?'; }
const COLORS = ['#3547E0','#0E8272','#D9481C','#7A2FC0','#B9760A','#0E7FA8','#C22A6D','#1F8A3B'];
function colorFor(id){ let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
function avatar(id, name, size = 'sm'){ return `<div class="avatar ${size}" style="background:${colorFor(id)}">${esc(initials(name))}</div>`; }
const rpFmt = new Intl.NumberFormat('id-ID');
function rupiah(n){ return n > 0 ? `Rp${rpFmt.format(n)}` : 'Free'; }
function fmtDate(iso, o){ return new Date(iso).toLocaleDateString('en-GB', o); }
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }); }
function ymd(d){ d = new Date(d); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function endTime(c){ return new Date(new Date(c.starts_at).getTime() + c.duration_min * 60000).toISOString(); }
function durLabel(m){ return m % 60 === 0 ? `${m/60} hr` : m > 60 ? `${Math.floor(m/60)} hr ${m%60} min` : `${m} min`; }
function relTime(iso){
  const d = new Date(iso), now = new Date(), s = (now - d) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return `${Math.floor(s/60)}m`;
  if (ymd(d) === ymd(now)) return fmtTime(iso);
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (ymd(d) === ymd(y)) return 'Yesterday';
  return fmtDate(iso, { day:'numeric', month:'short' });
}
function localInput(d){ const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function uid(){ return state.session?.user?.id; }
function first(n){ return String(n || '').split(' ')[0]; }
function kindLabel(c){ return c === 'competition' ? 'Competition' : 'Course'; }
function badgeText(c){ return `${kindLabel(c.category)}${c.subject ? ': ' + c.subject : ''}`; }
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function showToast(msg, isError = false){
  const t = $('toast'); if (!t) return;
  t.textContent = msg; t.classList.toggle('error', isError); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), isError ? 3600 : 2300);
}
function friendlyError(err){
  const m = (err && (err.message || err.error_description)) || String(err || 'Something went wrong');
  if (/Invalid login credentials/i.test(m)) return 'Wrong email or password.';
  if (/Email not confirmed/i.test(m)) return 'Confirm your email first — open the link we sent to your inbox.';
  if (/already registered/i.test(m)) return 'That email already has an account. Log in instead.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Can’t reach the server. Check your connection and try again.';
  if (/row-level security/i.test(m)) return 'You don’t have permission to do that.';
  return m;
}

/* ---------- In-app confirm dialog ---------- */
function openDialog({ title, body, confirmLabel = 'Confirm', cancelLabel = 'Keep', danger = false }, cb){
  $('dialogTitle').textContent = title;
  $('dialogBody').textContent = body;
  $('dialogOk').textContent = confirmLabel;
  $('dialogOk').className = 'btn ' + (danger ? 'btn-danger' : 'btn-brand');
  $('dialogCancel').textContent = cancelLabel;
  dialogCb = cb; $('dialog').hidden = false; $('dialogOk').focus();
}
function closeDialog(run){ $('dialog').hidden = true; const cb = dialogCb; dialogCb = null; if (run && cb) cb(); }

/* ---------- Unread markers (per user, this browser) ---------- */
function seenMap(){ return lsGet('cc_seen_' + uid(), {}); }
function markSeen(id){ const m = seenMap(); m[id] = new Date().toISOString(); lsSet('cc_seen_' + uid(), m); }
function isUnread(id){
  const last = state.lastMsg[id];
  if (!last || last.user_id === uid()) return false;
  const seen = seenMap()[id];
  return !seen || last.created_at > seen;
}

/* ---------- Notifications (bell) ---------- */
function pushNotif(title, body){
  state.notifs.unshift({ title, body, at: new Date().toISOString() });
  state.notifs = state.notifs.slice(0, 30);
  state.hasNotif = true;
  lsSet('cc_notifs_' + uid(), state.notifs);
  updateBell();
}
function updateBell(){
  const b = $('bellBtn'); if (!b) return;
  b.querySelector('.dot-flag')?.remove();
  if (state.hasNotif) b.insertAdjacentHTML('beforeend', '<span class="dot-flag"></span>');
}
function toggleNotifPanel(e){
  if (e) e.stopPropagation();
  const panel = $('notifPanel'), opening = !panel.classList.contains('open');
  if (!opening) return panel.classList.remove('open');
  panel.innerHTML = `<h5>Notifications</h5>` + (state.notifs.length
    ? state.notifs.map(n => `<div class="notif-item"><strong>${esc(n.title)}</strong>${esc(n.body)}<br><span>${relTime(n.at)}</span></div>`).join('')
    : `<div class="notif-empty">You’re all caught up.</div>`);
  const bell = $('bellBtn');
  if (bell) panel.style.top = (bell.getBoundingClientRect().bottom - screenEl.getBoundingClientRect().top + 8) + 'px';
  panel.classList.add('open');
  state.hasNotif = false; updateBell();
}

async function submitAuth(e){
  e.preventDefault();
  const err = $('authError'), btn = $('authSubmit'); err.textContent = '';
  const email = $('aEmail').value.trim(), pass = $('aPass') ? $('aPass').value : '';
  if (!/^\S+@\S+\.\S+$/.test(email)) { err.textContent = 'Enter a valid email address.'; return; }
  const redirectTo = location.origin + location.pathname;
  btn.disabled = true;
  try {
    if (authMode === 'login') {
      if (!pass) throw new Error('Enter your password.');
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
    } else if (authMode === 'signup') {
      const full_name = $('aName').value.trim();
      if (!full_name) throw new Error('Enter your full name.');
      if (pass.length < 6) throw new Error('Password needs at least 6 characters.');
      const { data, error } = await sb.auth.signUp({ email, password: pass,
        options: { emailRedirectTo: redirectTo, data: { full_name, campus: $('aCampus').value.trim(), major: $('aMajor').value.trim() } } });
      if (error) throw error;
      if (!data.session) { authMode = 'login'; renderAuth(`Almost done — open the confirmation link sent to <b>${esc(email)}</b>, then log in here.`); }
    } else {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) throw error;
      authMode = 'login'; renderAuth(`If <b>${esc(email)}</b> has an account, a reset link is on its way.`);
    }
  } catch (ex) { err.textContent = friendlyError(ex); }
  finally { if (document.body.contains(btn)) btn.disabled = false; }
}

  screenEl.innerHTML = `

const CLASS_SELECT = `
  id, host_id, title, category, subject, description, capacity, price, starts_at, duration_min, location, created_at, mentor_confirmed_at,
  host:profiles!classes_host_id_fkey ( id, full_name, campus, major, bio ),
  members:class_members ( user_id, joined_at, profile:profiles ( id, full_name, campus, major ) )`;

async function loadMe(){
  let { data, error } = await sb.from('profiles').select('*').eq('id', uid()).maybeSingle();
  if (error) throw error;
  if (!data) {
    const meta = state.session.user.user_metadata || {};
    const res = await sb.from('profiles').insert({ id: uid(),
      full_name: (meta.full_name || state.session.user.email.split('@')[0]).slice(0, 60),
      campus: meta.campus || null, major: meta.major || null }).select('*').single();
    if (res.error) throw res.error;
    data = res.data;
  }
  state.me = data; names.set(data.id, data.full_name);
}
async function loadClasses(){
  const since = new Date(Date.now() - 90 * 864e5).toISOString();
  const { data, error } = await sb.from('classes').select(CLASS_SELECT).gte('starts_at', since).order('starts_at', { ascending: true }).limit(500);
  if (error) throw error;
  state.classes = data || [];
  for (const c of state.classes) {
    if (c.host) names.set(c.host.id, c.host.full_name);
    for (const m of c.members) if (m.profile) names.set(m.profile.id, m.profile.full_name);
  }
}
async function loadLastMessages(){
  const ids = state.classes.filter(isMine).map(c => c.id);
  state.lastMsg = {};
  if (!ids.length) return;
  const { data, error } = await sb.from('messages').select('id, class_id, user_id, kind, body, created_at')
    .in('class_id', ids).order('created_at', { ascending: false }).limit(1000);
  if (error) throw error;
  for (const m of data) if (!state.lastMsg[m.class_id]) state.lastMsg[m.class_id] = m;
}
async function ensureNames(ids){
  const missing = [...new Set(ids)].filter(id => id && !names.has(id));
  if (!missing.length) return;
  const { data } = await sb.from('profiles').select('id, full_name').in('id', missing);
  (data || []).forEach(p => names.set(p.id, p.full_name));
}
async function loadSeats(){
  const { data, error } = await sb.rpc('seat_counts');
  if (error) throw error;
  state.seats = {};
  (data || []).forEach(r => { state.seats[r.class_id] = r.taken; });
}
const BOOKING_SELECT = `*, user:profiles!bookings_user_id_fkey ( id, full_name ),
  class:classes ( id, title, category, subject, starts_at, duration_min, price, location, host_id, mentor_confirmed_at,
                  host:profiles!classes_host_id_fkey ( id, full_name ) )`;
async function loadBookings(){
  const { data, error } = await sb.from('bookings').select(BOOKING_SELECT).order('created_at', { ascending: false }).limit(1000);
  if (error) throw error;
  state.bookings = data || [];
  state.bookings.forEach(b => { if (b.user) names.set(b.user.id, b.user.full_name); });
}
async function loadAccounts(){
  const { data, error } = await sb.from('payout_accounts').select('*');
  if (error) throw error;
  state.accounts = {};
  (data || []).forEach(a => { state.accounts[a.user_id] = a; });
  state.myAccount = state.accounts[uid()] || null;
}
async function reloadAll(){
  await loadClasses();
  await Promise.all([loadSeats(), loadBookings(), loadAccounts(), loadLastMessages()]);
}

const FILTERS = [['all','All'], ['course','Courses'], ['competition','Competitions'], ['free','Free']];
const SORTS = [['soonest','Soonest'], ['cheapest','Lowest price'], ['seats','Most seats left']];
function renderChips(){
  const row = $('chipRow'); if (!row) return;
  row.innerHTML = FILTERS.map(([id, l]) => `<button class="chip ${state.filter === id ? 'active' : ''}" onclick="setFilter('${id}')">${l}</button>`).join('');
}
function setFilter(f){ state.filter = f; renderChips(); renderBody(); }
function setSort(s){ state.sort = s; renderBody(); }
function setQuery(v){ state.query = v; const c = $('clearSearch'); if (c) c.hidden = !v; renderBody(); }
function clearSearch(){ state.query = ''; const i = $('searchInput'); if (i) { i.value = ''; i.focus(); } setQuery(''); }

function renderDiscover(b){
  const q = state.query.trim().toLowerCase();
  let list = state.classes.filter(c => !hasStarted(c) && !isHost(c));
  if (state.filter === 'course' || state.filter === 'competition') list = list.filter(c => c.category === state.filter);
  if (state.filter === 'free') list = list.filter(c => c.price === 0);
  if (q) list = list.filter(c => [c.title, c.subject, c.location, c.description, c.host?.full_name, c.host?.campus].some(v => (v || '').toLowerCase().includes(q)));
  const left = c => c.capacity - seatsTaken(c);
  if (state.sort === 'cheapest') list.sort((a, z) => a.price - z.price || a.starts_at.localeCompare(z.starts_at));
  else if (state.sort === 'seats') list.sort((a, z) => left(z) - left(a) || a.starts_at.localeCompare(z.starts_at));
  if (!list.length) {
    b.innerHTML = `<div class="empty-note">${q || state.filter !== 'all' ? 'No upcoming classes match this search.' : 'No upcoming classes from other mentors yet.'}<br>Want to teach something? Switch to <b>Mentor</b> and create a class.</div>`;
    return;
  }
  b.innerHTML = `
    <div class="section-row">
      <div class="section-label"><b>${list.length}</b> upcoming class${list.length === 1 ? '' : 'es'}</div>
      <select class="sort-select" aria-label="Sort classes" onchange="setSort(this.value)">${SORTS.map(([v, l]) => `<option value="${v}" ${state.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>
    ${list.map(classCardHTML).join('')}`;
}

function classCardHTML(c){
  const taken = seatsTaken(c), full = taken >= c.capacity, pct = Math.min(100, Math.round(taken / c.capacity * 100));
  const tag = isHost(c) ? ' <span class="mine-tag">· You host</span>' : isMember(c) ? ' <span class="mine-tag">· Joined</span>' : '';
  return `
    <button class="class-card" onclick="openClass('${c.id}')">
      <div class="date-block ${c.category === 'competition' ? 'competition' : ''}">
        <strong>${fmtDate(c.starts_at, { day:'numeric' })}</strong><span>${fmtDate(c.starts_at, { month:'short' })}</span><em>${fmtTime(c.starts_at)}</em>

        <div class="class-meta">
          <span>${ic.user}<b>${esc(c.host?.full_name || 'Mentor')}</b></span>
          <span>${ic.pin}<b>${esc(c.location)}</b></span>
        </div>
        <div class="class-foot">
          <div class="seats">
            <div class="seats-bar ${full ? 'full' : ''}"><i style="width:${pct}%"></i></div>
            <small>${full ? 'Full' : `${taken} of ${c.capacity} seats taken`}${tag}</small>
          </div>
          <span class="price">${rupiah(c.price)}</span>
        </div>
      </div>
    </button>`;
}

function renderDetail(){

  const myB = myBookingFor(c.id), active = myB && ['awaiting_payment','paid'].includes(bStatus(myB)) ? myB : null;
  const paidMember = member && active && bStatus(active) === 'paid';

  if (host) {
    const canDelete = !classBookings(c.id).some(b => b.status === 'paid');

    else if (!member) payBlock = `<div class="block"><h4>How payment works</h4><p>Book a seat to get a virtual account number. Pay it within 24 hours; once our admin verifies the transfer you join the class and its group chat. The mentor is paid only after the class, when you both confirm it happened.</p></div>`;
  }

    hostBlock = `<div class="block"><h4>Payments (${paid.length} paid)</h4>

      ${ended && paid.length ? (c.mentor_confirmed_at
          ? `<p class="hint">You confirmed this class took place. Our admin releases your payout once students confirm too.</p>`
          : `<button class="btn btn-brand" style="width:100%;margin-top:12px" onclick="mentorConfirm('${c.id}')">Confirm the class took place</button><p class="hint">Needed before you get paid.</p>`) : ''}
    </div>`;
  }

  el.innerHTML = head(host ? 'Your class' : 'Class details') + `
    <div class="overlay-body">
      <div class="detail-hero"><span class="kind-badge ${c.category}">${esc(badgeText(c))}</span><h2>${esc(c.title)}</h2></div>
      <div class="facts">

        <div class="fact"><span>Time</span><strong>${fmtTime(c.starts_at)}–${fmtTime(endTime(c))} (${durLabel(c.duration_min)})</strong></div>

      ${payBlock}${hostBlock}
      ${c.description ? `<div class="block"><h4>About this class</h4><p class="pre">${esc(c.description)}</p></div>` : ''}
      <div class="block">
        <h4>Mentor</h4>
        <div class="person-row">${avatar(c.host_id, c.host?.full_name)}<div><strong>${esc(c.host?.full_name || 'Mentor')}${host ? ' (you)' : ''}</strong><span>${esc([c.host?.campus, c.host?.major].filter(Boolean).join(', '))}</span></div></div>

function calendarHTML(list){
  const byDay = {};
  list.forEach(c => (byDay[ymd(c.starts_at)] = byDay[ymd(c.starts_at)] || []).push(c));
  const y = state.calY, m = state.calM, today = ymd(new Date());
  const firstDow = new Date(y, m, 1).getDay(), n = new Date(y, m + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < firstDow; i++) cells += `<span class="cal-day pad"></span>`;
  for (let d = 1; d <= n; d++) {
    const ds = `${y}-${String(m + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = ['cal-day', ds === today && 'today', ds === state.selectedDate && 'selected', byDay[ds] && ds < today && 'past-dot'].filter(Boolean).join(' ');
    cells += `<button class="${cls}" onclick="selectDay('${ds}')" aria-label="${ds}${byDay[ds] ? ', has classes' : ''}">${d}${byDay[ds] ? '<span class="cal-dot"></span>' : ''}</button>`;
  }
  const label = new Date(y, m, 1).toLocaleDateString('en-GB', { month:'long', year:'numeric' });
  const agenda = state.selectedDate ? `<div class="cal-agenda"><h5>${fmtDate(state.selectedDate + 'T00:00:00', { weekday:'long', day:'numeric', month:'long' })}</h5>
      ${(byDay[state.selectedDate] || []).map(classCardHTML).join('') || `<div class="empty-note" style="padding:10px 0">Nothing on this day.</div>`}</div>` : '';
  return `<div class="cal-card">
    <div class="cal-head"><strong>${label}</strong><div class="cal-nav">
      <button class="cal-nav-btn" onclick="calNav(-1)" aria-label="Previous month">${ic.back}</button>
      <button class="cal-nav-btn" onclick="calNav(1)" aria-label="Next month">${ic.next}</button></div></div>
    <div class="cal-dow">${['S','M','T','W','T','F','S'].map(x => `<span>${x}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>${agenda}</div>`;
}
function selectDay(ds){ state.selectedDate = state.selectedDate === ds ? null : ds; renderBody(); }
function calNav(d){ state.calM += d; if (state.calM < 0) { state.calM = 11; state.calY--; } if (state.calM > 11) { state.calM = 0; state.calY++; } state.selectedDate = null; renderBody(); }

async function submitClass(e){
  e.preventDefault();

  const capacity = parseInt($('fCap').value, 10), price = parseInt($('fPrice').value || '0', 10);

  if (starts <= new Date()) return void (err.textContent = 'Pick a time in the future.');
  if (!(capacity >= 1 && capacity <= 200)) return void (err.textContent = 'Seats must be between 1 and 200.');
  if (!(price >= 0)) return void (err.textContent = 'Price can’t be negative.');
  if (location.length < 2) return void (err.textContent = 'Say where the class happens.');

    return `<button class="chat-row" onclick="openChat('${c.id}')">

async function openChat(id){
  const c = classById(id); if (!c) return;
  state.openChat = id; state.chatMsgs = [];
  const el = $('chatOverlay');
  el.innerHTML = `
    <div class="overlay-header">
      <button class="back-btn" onclick="closeOverlay('chatOverlay')" aria-label="Back">${ic.back}</button>
      <div class="group-icon sm" style="background:${colorFor(c.id)}">${esc(initials(c.subject || c.title))}</div>
      <button class="head-btn" onclick="openClass('${c.id}')" aria-label="Class details">
        <div class="overlay-title">${esc(c.title)}</div>
        <div class="overlay-sub">${c.members.length + 1} people, ${fmtDate(c.starts_at, { day:'numeric', month:'short' })} at ${fmtTime(c.starts_at)}</div>
      </button>
    </div>
    <div class="overlay-body" id="threadScroll"><div class="thread" id="threadBody"><div class="loading">Loading messages…</div></div></div>
    <form class="composer" id="composer">
      <textarea id="chatInput" rows="1" maxlength="2000" placeholder="Message the group" aria-label="Message"></textarea>
      <button class="send-btn" type="submit" aria-label="Send">${ic.send}</button>
    </form>`;
  openOverlay('chatOverlay');
  const input = $('chatInput');
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); } });
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 110) + 'px'; });
  $('composer').addEventListener('submit', e => { e.preventDefault(); sendMessage(); });

  const { data, error } = await sb.from('messages').select('id, class_id, user_id, kind, body, created_at')
    .eq('class_id', id).order('created_at', { ascending: false }).limit(300);
  if (state.openChat !== id) return;
  if (error) { $('threadBody').innerHTML = `<div class="empty-note">${esc(friendlyError(error))}</div>`; return; }
  const fresh = data.reverse(), ids = new Set(fresh.map(m => m.id));
  state.chatMsgs = fresh.concat(state.chatMsgs.filter(m => !ids.has(m.id)));
  await ensureNames(state.chatMsgs.map(m => m.user_id));
  drawThread(); markSeen(id); updateBadges(); renderBody();
}

function drawThread(){
  const t = $('threadBody'); if (!t) return;
  const msgs = state.chatMsgs, c = classById(state.openChat);
  if (!msgs.length) { t.innerHTML = `<div class="empty-note">No messages yet. Start the conversation.</div>`; return; }
  let html = '', lastDay = '';
  msgs.forEach((m, i) => {
    const day = ymd(m.created_at);
    if (day !== lastDay) { lastDay = day; html += `<div class="day-sep">${day === ymd(new Date()) ? 'Today' : fmtDate(m.created_at, { weekday:'short', day:'numeric', month:'short' })}</div>`; }
    if (m.kind === 'system') { html += `<div class="sys-msg">${esc(m.body)}</div>`; return; }
    const prev = msgs[i - 1], next = msgs[i + 1], mine = m.user_id === uid();
    const same = (a, b) => a && b && a.user_id === b.user_id && a.kind !== 'system' && b.kind !== 'system' && ymd(a.created_at) === ymd(b.created_at);
    const startRun = !same(prev, m);
    const endRun = !same(m, next) || (new Date(next.created_at) - new Date(m.created_at)) > 5 * 60000;
    html += `<div class="bubble-wrap ${mine ? 'me' : 'them'}${startRun ? '' : ' cont'}">
      ${!mine && startRun ? `<div class="bubble-author">${esc(names.get(m.user_id) || 'Member')}${c && m.user_id === c.host_id ? ' (mentor)' : ''}</div>` : ''}
      <div class="bubble">${esc(m.body)}</div>
      ${endRun ? `<div class="bubble-time">${fmtTime(m.created_at)}</div>` : ''}</div>`;
  });
  t.innerHTML = html;
  const sc = $('threadScroll'); if (sc) sc.scrollTop = sc.scrollHeight;
}

async function sendMessage(){
  const input = $('chatInput'), id = state.openChat, body = input.value.trim();
  if (!body || !id) return;
  input.value = ''; input.style.height = 'auto';
  const { data, error } = await sb.from('messages').insert({ class_id: id, body }).select('id, class_id, user_id, kind, body, created_at').single();
  if (error) { input.value = body; return showToast(friendlyError(error), true); }
  addMessage(data); input.focus();
}
function addMessage(m){
  const prev = state.lastMsg[m.class_id];
  if (!prev || prev.created_at <= m.created_at) state.lastMsg[m.class_id] = m;
  if (state.openChat === m.class_id && !state.chatMsgs.some(x => x.id === m.id)) { state.chatMsgs.push(m); drawThread(); markSeen(m.class_id); }
}

/* ============================================================
   PAYMENTS — virtual account, admin verification, escrow payout
   Student books a seat → pays the VA → admin verifies → student
   joins. After the class, mentor + student confirm → admin
   releases the money to the mentor (or refunds the student).
   Prototype: VA numbers are random and no real money moves.
   ============================================================ */
const STATUS = {
  awaiting_payment: ['Waiting for payment', 'warn'], checking: ['Being verified', 'info'],
  paid: ['Paid', 'good'], rejected: ['Rejected', 'bad'], expired: ['Expired', 'muted'],
  cancelled: ['Cancelled', 'muted'], released: ['Paid out', 'good'], refunded: ['Refunded', 'muted'],
};
function bStatus(b){ return b.status === 'awaiting_payment' && new Date(b.expires_at) <= new Date() && !b.claimed_at ? 'expired' : b.status; }
function statusPill(st, claimed){ const [l, k] = STATUS[st === 'awaiting_payment' && claimed ? 'checking' : st] || [st, 'muted']; return `<span class="pill ${k}">${l}</span>`; }
function myBookingFor(cid){ return state.bookings.find(b => b.class_id === cid && b.user_id === uid()); }
function classBookings(cid){ return state.bookings.filter(b => b.class_id === cid); }
function bookingById(id){ return state.bookings.find(b => b.id === id); }
function vaFormat(n){ return String(n).replace(/(\d{4})(?=\d)/g, '$1 '); }
function timeLeft(iso){
  const ms = new Date(iso) - new Date(); if (ms <= 0) return 'expired';
  const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000);
  return h ? `${h} hr ${m} min left` : `${m} min left`;
}
function whenLabel(iso){ return `${fmtDate(iso, { weekday:'short', day:'numeric', month:'short' })}, ${fmtTime(iso)}`; }
function accountLine(a){ return a ? `${a.bank_name} ${a.account_number} (${a.account_name})` : 'No bank account added yet'; }
async function copyText(t){
  try { await navigator.clipboard.writeText(t); showToast('Copied'); }
  catch (e) { const i = document.createElement('textarea'); i.value = t; document.body.appendChild(i); i.select(); try { document.execCommand('copy'); showToast('Copied'); } catch (_) {} i.remove(); }
}
async function rpc(name, args, okMsg){
  const { data, error } = await sb.rpc(name, args);
  if (error) { showToast(friendlyError(error), true); return { error }; }
  await reloadAll().catch(() => {});
  refreshVisible();
  if (okMsg) showToast(okMsg);
  return { data };
}
